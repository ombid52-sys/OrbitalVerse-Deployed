    function evalRealSphericalHarmonic(l, mIndex, nx, ny, nz) {
      if (l === 0) return 0.5;
      if (l === 1) {
        if (mIndex === 0) return 0.85 * nx;
        if (mIndex === 1) return 0.85 * nz;
        return 0.85 * ny;
      }
      if (l === 2) {
        if (mIndex === 0) return 1.75 * nx * ny;
        if (mIndex === 1) return 1.75 * ny * nz;
        if (mIndex === 2) return 0.55 * (3 * nz * nz - 1);
        if (mIndex === 3) return 1.75 * nx * nz;
        return 0.88 * (nx * nx - ny * ny);
      }
      if (l === 3) {
        if (mIndex === 0) return 0.95 * ny * (3 * nx * nx - ny * ny);
        if (mIndex === 1) return 3.1 * nx * ny * nz;
        if (mIndex === 2) return 0.85 * ny * (5 * nz * nz - 1);
        if (mIndex === 3) return 0.55 * nz * (5 * nz * nz - 3);
        if (mIndex === 4) return 0.85 * nx * (5 * nz * nz - 1);
        if (mIndex === 5) return 1.55 * nz * (nx * nx - ny * ny);
        return 0.95 * nx * (nx * nx - 3 * ny * ny);
      }
      return 0.5;
    }

    function buildOrbitalSurfaceMesh(n, l, mIndex, color) {
      const baseR = 26 + n * 22;
      const nTheta = l === 0 ? 18 : 26;
      const nPhi = l === 0 ? 28 : 40;
      const vertices = [];

      for (let i = 0; i <= nTheta; i++) {
        const theta = (i / nTheta) * Math.PI;
        const sinT = Math.sin(theta);
        const cosT = Math.cos(theta);
        const row = [];

        for (let j = 0; j <= nPhi; j++) {
          const phi = (j / nPhi) * Math.PI * 2;
          const nx = sinT * Math.cos(phi);
          const ny = sinT * Math.sin(phi);
          const nz = cosT;

          const yVal = evalRealSphericalHarmonic(l, mIndex, nx, ny, nz);
          const amp = Math.abs(yVal);
          const r = l === 0 ? baseR * 0.72 : baseR * amp * 1.05;

          row.push({
            x: nx * r,
            y: ny * r,
            z: nz * r,
            nx,
            ny,
            nz,
            amp,
            phaseSign: yVal >= 0 ? 1 : -1
          });
        }
        vertices.push(row);
      }

      const faces = [];
      for (let i = 0; i < nTheta; i++) {
        for (let j = 0; j < nPhi; j++) {
          const v00 = vertices[i][j];
          const v10 = vertices[i + 1][j];
          const v11 = vertices[i + 1][j + 1];
          const v01 = vertices[i][j + 1];

          const maxAmp = Math.max(v00.amp, v10.amp, v11.amp, v01.amp);
          if (maxAmp < 0.06) continue;

          faces.push({
            verts: [v00, v10, v11, v01],
            cx: (v00.x + v10.x + v11.x + v01.x) * 0.25,
            cy: (v00.y + v10.y + v11.y + v01.y) * 0.25,
            cz: (v00.z + v10.z + v11.z + v01.z) * 0.25,
            nx: (v00.nx + v10.nx + v11.nx + v01.nx) * 0.25,
            ny: (v00.ny + v10.ny + v11.ny + v01.ny) * 0.25,
            nz: (v00.nz + v10.nz + v11.nz + v01.nz) * 0.25,
            phaseSign: v00.phaseSign,
            color
          });
        }
      }

      return faces;
    }

    function computeAufbauSubshells(electronCount) {
      let remaining = electronCount;
      const subshells = {};
      for (const sub of SUBSHELL_ORDER) {
        if (remaining <= 0) break;
        const type = sub[1];
        const cap = SUBSHELL_CAPACITY[type];
        const fill = Math.min(remaining, cap);
        if (fill > 0) {
          subshells[sub] = fill;
          remaining -= fill;
        }
      }
      return subshells;
    }

    function computeGroundStateSubshells(z) {
      const anomaly = ANOMALOUS_CONFIGS[z];
      if (!anomaly) return computeAufbauSubshells(z);

      let coreGas = null;
      for (let i = NOBLE_GASES.length - 1; i >= 0; i--) {
        if (NOBLE_GASES[i].z < z) {
          coreGas = NOBLE_GASES[i];
          break;
        }
      }
      const subshells = {};
      if (coreGas) {
        for (const sub of coreGas.subshells) {
          subshells[sub] = SUBSHELL_CAPACITY[sub[1]];
        }
      }
      for (const [sub, count] of Object.entries(anomaly.valence)) {
        if (count > 0) subshells[sub] = count;
      }
      return subshells;
    }

    function formatConfigString(subshellsMap, orderType = 'aufbau') {
      const orderList = orderType === 'shell' ? SHELL_ORDER : SUBSHELL_ORDER;
      return orderList
        .filter((sub) => subshellsMap[sub] > 0)
        .map((sub) => `${sub}${toSuperscript(subshellsMap[sub])}`)
        .join(' ');
    }

    function formatNobleGasString(z, subshellsMap, orderType = 'aufbau') {
      if (z <= 2) return formatConfigString(subshellsMap, orderType);
      let coreGas = null;
      for (let i = NOBLE_GASES.length - 1; i >= 0; i--) {
        if (NOBLE_GASES[i].z < z) {
          coreGas = NOBLE_GASES[i];
          break;
        }
      }
      if (!coreGas) return formatConfigString(subshellsMap, orderType);

      const coreSet = new Set(coreGas.subshells);
      const orderList = orderType === 'shell' ? SHELL_ORDER : SUBSHELL_ORDER;
      const valenceParts = orderList
        .filter((sub) => !coreSet.has(sub) && subshellsMap[sub] > 0)
        .map((sub) => `${sub}${toSuperscript(subshellsMap[sub])}`);

      return `[${coreGas.symbol}] ${valenceParts.join(' ')}`.trim();
    }

    function computeShellDistribution(subshellsMap) {
      const shells = [0, 0, 0, 0, 0, 0, 0];
      for (const [sub, count] of Object.entries(subshellsMap)) {
        const n = parseInt(sub[0], 10);
        if (n >= 1 && n <= 7) shells[n - 1] += count;
      }
      let lastNonZero = shells.length - 1;
      while (lastNonZero > 0 && shells[lastNonZero] === 0) {
        lastNonZero--;
      }
      return shells.slice(0, lastNonZero + 1).map((count, idx) => ({
        n: idx + 1,
        letter: SHELL_LETTERS[idx],
        count,
        capacity: 2 * Math.pow(idx + 1, 2)
      }));
    }

    function generateOrbitalBoxesForSubshell(subshellLabel, electronCount) {
      const n = parseInt(subshellLabel[0], 10);
      const type = subshellLabel[1];
      const l = L_QUANTUM_NUMBER[type];
      const numBoxes = SUBSHELL_BOXES[type];
      const capacity = SUBSHELL_CAPACITY[type];
      const validCount = Math.max(0, Math.min(electronCount, capacity));

      const boxes = [];
      for (let i = 0; i < numBoxes; i++) {
        const ml = -l + i;
        boxes.push({
          index: i,
          ml,
          mlLabel: ml > 0 ? `+${ml}` : `${ml}`,
          up: false,
          down: false,
          electrons: 0
        });
      }

      let remaining = validCount;
      for (let i = 0; i < numBoxes && remaining > 0; i++) {
        boxes[i].up = true;
        boxes[i].electrons += 1;
        remaining--;
      }
      for (let i = 0; i < numBoxes && remaining > 0; i++) {
        boxes[i].down = true;
        boxes[i].electrons += 1;
        remaining--;
      }

      const unpaired = boxes.reduce((acc, b) => acc + (b.up && !b.down ? 1 : 0), 0);
      const paired = boxes.reduce((acc, b) => acc + (b.up && b.down ? 1 : 0), 0);

      return {
        subshell: subshellLabel,
        n,
        l,
        type,
        capacity,
        electronCount: validCount,
        boxes,
        unpaired,
        paired
      };
    }

    function buildElectronSequence(subshellsMap) {
      const sequence = [];
      for (const sub of SUBSHELL_ORDER) {
        const count = subshellsMap[sub] || 0;
        if (count <= 0) continue;
        const n = parseInt(sub[0], 10);
        const type = sub[1];
        const l = L_QUANTUM_NUMBER[type];
        const numBoxes = SUBSHELL_BOXES[type];

        for (let eIdx = 0; eIdx < count; eIdx++) {
          const isSpinUp = eIdx < numBoxes;
          const boxIndex = isSpinUp ? eIdx : eIdx - numBoxes;
          const ml = -l + boxIndex;
          const ms = isSpinUp ? '+1/2' : '-1/2';
          sequence.push({
            stepNumber: sequence.length + 1,
            subshell: sub,
            n,
            l,
            ml,
            ms,
            boxIndex,
            spin: isSpinUp ? 'up' : 'down'
          });
        }
      }
      return sequence;
    }

    const ELEMENTS_DATABASE = RAW_ELEMENTS.map(([z, symbol, name, period, group, block, category, mass]) => {
      const groundSubshells = computeGroundStateSubshells(z);
      const isAnomalous = Boolean(ANOMALOUS_CONFIGS[z]);
      const isSuperheavy = z >= 104;

      let statusLabel = 'Standard Aufbau';
      let statusNote = '';

      if (isAnomalous) {
        statusLabel = z >= 103 ? 'Relativistic Exception' : 'Aufbau Exception';
        statusNote = ANOMALOUS_CONFIGS[z].reason;
      } else if (isSuperheavy) {
        statusLabel = 'Relativistic Superheavy';
        statusNote =
          z === 118
            ? 'Predicted closed-shell [Rn] 7s² 5f¹⁴ 6d¹⁰ 7p⁶ with strong 7p spin-orbit splitting.'
            : 'Ground state derived via relativistic Dirac-Fock calculations.';
      }

      const shells = computeShellDistribution(groundSubshells);
      const orbitalDiagrams = SUBSHELL_ORDER
        .filter((sub) => groundSubshells[sub] > 0)
        .map((sub) => generateOrbitalBoxesForSubshell(sub, groundSubshells[sub]));

      const totalUnpaired = orbitalDiagrams.reduce((acc, d) => acc + d.unpaired, 0);
      const spinMultiplicity = totalUnpaired + 1;

      return {
        z,
        symbol,
        name,
        period,
        group,
        block,
        category,
        mass,
        groundSubshells,
        isAnomalous,
        isSuperheavy,
        statusLabel,
        statusNote,
        fullConfigShell: formatConfigString(groundSubshells, 'shell'),
        nobleConfigAufbau: formatNobleGasString(z, groundSubshells, 'aufbau'),
        shells,
        orbitalDiagrams,
        totalUnpaired,
        spinMultiplicity,
        magneticCharacter: totalUnpaired > 0 ? 'Paramagnetic' : 'Diamagnetic'
      };
    });

    function Interactive3DAtomSimulator({
      element,
      activeSubshellsMap,
      activeShells,
      isDark
    }) {
      const canvasRef = useRef(null);

      const occupiedSubshellsList = useMemo(
        () => SUBSHELL_ORDER.filter((s) => activeSubshellsMap[s] > 0),
        [activeSubshellsMap]
      );

      const [selectedSubshell, setSelectedSubshell] = useState('valence');
      const [selectedOrbitalIdx, setSelectedOrbitalIdx] = useState('all');
      const [shellPlane, setShellPlane] = useState('XY');
      const [simPlaying, setSimPlaying] = useState(true);

      useEffect(() => {
        setSelectedOrbitalIdx('all');
      }, [element.z, selectedSubshell]);

      const cameraRef = useRef({
        rotX: 0.48,
        rotY: -0.62,
        zoom: 1.0,
        isDragging: false,
        lastX: 0,
        lastY: 0
      });

      const targetSubshells = useMemo(() => {
        if (
          selectedSubshell !== 'all' &&
          selectedSubshell !== 'valence' &&
          activeSubshellsMap[selectedSubshell]
        ) {
          return [selectedSubshell];
        }
        if (selectedSubshell === 'all') {
          return occupiedSubshellsList;
        }
        return occupiedSubshellsList.slice(-1);
      }, [selectedSubshell, activeSubshellsMap, occupiedSubshellsList]);

      const orbitalSurfaceFaces = useMemo(() => {
        const allFaces = [];
        for (const sub of targetSubshells) {
          const n = parseInt(sub[0], 10);
          const type = sub[1];
          const l = L_QUANTUM_NUMBER[type];
          const numBoxes = SUBSHELL_BOXES[type];
          const count = activeSubshellsMap[sub] || 0;
          const color = BLOCK_STYLES[type].accent;

          for (let mIdx = 0; mIdx < numBoxes; mIdx++) {
            if (selectedOrbitalIdx !== 'all') {
              if (mIdx !== Number(selectedOrbitalIdx)) continue;
            } else if (mIdx >= count) {
              continue;
            }

            const meshFaces = buildOrbitalSurfaceMesh(n, l, mIdx, color);
            for (let k = 0; k < meshFaces.length; k++) {
              allFaces.push(meshFaces[k]);
            }
          }
        }
        return allFaces;
      }, [targetSubshells, activeSubshellsMap, selectedOrbitalIdx]);

      const electrons3D = useMemo(() => {
        const list = [];
        for (const sub of SUBSHELL_ORDER) {
          const count = activeSubshellsMap[sub] || 0;
          if (count <= 0) continue;
          const n = parseInt(sub[0], 10);
          const type = sub[1];
          const l = L_QUANTUM_NUMBER[type];
          const numBoxes = SUBSHELL_BOXES[type];

          for (let i = 0; i < count; i++) {
            const isUp = i < numBoxes;
            const mIndex = isUp ? i : i - numBoxes;
            const id = list.length;

            const phaseA = (id * 2.3999632 + mIndex * 1.1) % (2 * Math.PI);
            const phaseB = (id * 1.6180339 + n * 0.7) % (2 * Math.PI);

            list.push({
              id,
              subshell: sub,
              n,
              l,
              type,
              mIndex,
              spin: isUp ? '+1/2' : '-1/2',
              phaseA,
              phaseB,
              color: TRACE_PALETTE[id % TRACE_PALETTE.length],
              blockColor: BLOCK_STYLES[type].accent
            });
          }
        }
        return list;
      }, [activeSubshellsMap]);

      const timeRef = useRef(0);
      const tracesRef = useRef({});

      useEffect(() => {
        tracesRef.current = {};
      }, [element.z, selectedSubshell, selectedOrbitalIdx]);

      const computeElectronPosition3D = useCallback((e, t) => {
        const baseR = 26 + e.n * 22;
        const w1 = (0.85 + (e.id % 5) * 0.12) * (e.spin === '+1/2' ? 1 : -1);
        const w2 = 1.25 + (e.mIndex + 1) * 0.2;
        const u = t * w1 + e.phaseA;
        const v = t * w2 + e.phaseB;

        if (e.l === 0) {
          const r = baseR * 0.72;
          return {
            x: Math.sin(u) * Math.cos(v) * r,
            y: Math.sin(u) * Math.sin(v) * r,
            z: Math.cos(u) * r
          };
        }

        const nx = Math.sin(u) * Math.cos(v * 0.75);
        const ny = Math.sin(u) * Math.sin(v * 0.75);
        const nz = Math.cos(u);
        const yHarmonic = evalRealSphericalHarmonic(e.l, e.mIndex, nx, ny, nz);
        const r = baseR * Math.max(0.18, Math.abs(yHarmonic) * 1.02);

        return {
          x: nx * r,
          y: ny * r,
          z: nz * r
        };
      }, []);

      useEffect(() => {
        let animFrameId;
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');

        const project3D = (x, y, z, width, height, cam, maxShellN) => {
          const qx = x;
          const qy = -z;
          const qz = y;

          const cosY = Math.cos(cam.rotY);
          const sinY = Math.sin(cam.rotY);
          const x1 = qx * cosY - qz * sinY;
          const z1 = qx * sinY + qz * cosY;

          const cosX = Math.cos(cam.rotX);
          const sinX = Math.sin(cam.rotX);
          const y2 = qy * cosX - z1 * sinX;
          const z2 = qy * sinX + z1 * cosX;

          const autoFit = Math.max(0.68, 1.15 - maxShellN * 0.065);
          const fov = 440 * cam.zoom * autoFit;
          const viewerDist = 420;
          const scale = fov / Math.max(80, viewerDist + z2);

          return {
            sx: width / 2 + x1 * scale,
            sy: height / 2 + y2 * scale,
            depth: z2,
            scale
          };
        };

        const renderFrame = () => {
          const rect = canvas.getBoundingClientRect();
          const dpr = window.devicePixelRatio || 1;
          if (
            canvas.width !== Math.floor(rect.width * dpr) ||
            canvas.height !== Math.floor(rect.height * dpr)
          ) {
            canvas.width = Math.floor(rect.width * dpr);
            canvas.height = Math.floor(rect.height * dpr);
          }

          ctx.save();
          ctx.scale(dpr, dpr);
          const width = rect.width;
          const height = rect.height;
          const cam = cameraRef.current;
          const maxShellN = activeShells.length || 1;

          ctx.fillStyle = isDark ? '#101214' : '#f4f7fb';
          ctx.fillRect(0, 0, width, height);

          if (simPlaying) {
            timeRef.current += 0.018;
          }
          const t = timeRef.current;

          // 1. Cartesian Axes
          const axisLen = 40 + maxShellN * 24;
          const origin = project3D(0, 0, 0, width, height, cam, maxShellN);
          const axesDef = [
            { label: 'X', x: axisLen, y: 0, z: 0, color: '#ef4444' },
            { label: 'Y', x: 0, y: axisLen, z: 0, color: '#10b981' },
            { label: 'Z', x: 0, y: 0, z: axisLen, color: '#3b82f6' }
          ];
          axesDef.forEach((ax) => {
            const pEnd = project3D(ax.x, ax.y, ax.z, width, height, cam, maxShellN);
            ctx.beginPath();
            ctx.moveTo(origin.sx, origin.sy);
            ctx.lineTo(pEnd.sx, pEnd.sy);
            ctx.strokeStyle = isDark ? `${ax.color}44` : `${ax.color}66`;
            ctx.lineWidth = 1;
            ctx.stroke();

            ctx.fillStyle = isDark ? `${ax.color}aa` : ax.color;
            ctx.font = '600 10px "JetBrains Mono", monospace';
            ctx.fillText(ax.label, pEnd.sx + 4, pEnd.sy + 3);
          });

          // 2. K-Q Shell Rings
          const ringSegments = 64;
          activeShells.forEach((sh) => {
            const shellR = 26 + sh.n * 22;
            ctx.save();
            ctx.beginPath();

            for (let s = 0; s <= ringSegments; s++) {
              const ang = (s / ringSegments) * Math.PI * 2;
              const c = Math.cos(ang) * shellR;
              const sn = Math.sin(ang) * shellR;

              let px = 0, py = 0, pz = 0;
              if (shellPlane === 'XY') { px = c; py = sn; pz = 0; }
              else if (shellPlane === 'YZ') { px = 0; py = c; pz = sn; }
              else { px = c; py = 0; pz = sn; }

              const pt = project3D(px, py, pz, width, height, cam, maxShellN);
              if (s === 0) ctx.moveTo(pt.sx, pt.sy);
              else ctx.lineTo(pt.sx, pt.sy);
            }

            ctx.setLineDash([3, 4]);
            ctx.strokeStyle = isDark
              ? 'rgba(168, 199, 250, 0.30)'
              : 'rgba(11, 87, 208, 0.28)';
            ctx.lineWidth = 1.15;
            ctx.stroke();
            ctx.setLineDash([]);

            let lx = 0, ly = 0, lz = 0;
            if (shellPlane === 'XY') lx = shellR;
            else if (shellPlane === 'YZ') ly = shellR;
            else lz = shellR;

            const labelPt = project3D(lx, ly, lz, width, height, cam, maxShellN);
            ctx.fillStyle = isDark
              ? 'rgba(227, 227, 227, 0.65)'
              : 'rgba(31, 31, 31, 0.65)';
            ctx.font = '500 9.5px "JetBrains Mono", monospace';
            ctx.fillText(`${sh.letter}(${sh.count})`, labelPt.sx + 4, labelPt.sy - 2);
            ctx.restore();
          });

          // 3. Orbital 3D Faces
          const projectedFaces = orbitalSurfaceFaces.map((f) => {
            const cProj = project3D(f.cx, f.cy, f.cz, width, height, cam, maxShellN);
            const pVerts = f.verts.map((v) =>
              project3D(v.x, v.y, v.z, width, height, cam, maxShellN)
            );
            return { ...f, pVerts, depth: cProj.depth };
          });

          projectedFaces.sort((a, b) => b.depth - a.depth);
          const singleOrbitalMode = targetSubshells.length === 1 && selectedOrbitalIdx !== 'all';

          for (let i = 0; i < projectedFaces.length; i++) {
            const face = projectedFaces[i];
            const pv = face.pVerts;
            const lightDot = Math.abs(face.nx * 0.45 - face.ny * 0.35 + face.nz * 0.82);
            const fillAlpha = 0.14 + 0.18 * lightDot;

            ctx.beginPath();
            ctx.moveTo(pv[0].sx, pv[0].sy);
            ctx.lineTo(pv[1].sx, pv[1].sy);
            ctx.lineTo(pv[2].sx, pv[2].sy);
            ctx.lineTo(pv[3].sx, pv[3].sy);
            ctx.closePath();

            const baseHex = singleOrbitalMode
              ? face.phaseSign > 0
                ? '#38bdf8'
                : '#f43f5e'
              : face.color;

            ctx.fillStyle = baseHex;
            ctx.globalAlpha = fillAlpha;
            ctx.fill();

            ctx.strokeStyle = baseHex;
            ctx.globalAlpha = fillAlpha * 0.55;
            ctx.lineWidth = 0.5;
            ctx.stroke();
          }
          ctx.globalAlpha = 1.0;

          // 4. Nucleus
          ctx.beginPath();
          ctx.arc(origin.sx, origin.sy, Math.max(4, 5.5 * origin.scale), 0, Math.PI * 2);
          ctx.fillStyle = '#ef4444';
          ctx.fill();
          ctx.strokeStyle = isDark ? '#ffffff55' : '#00000033';
          ctx.lineWidth = 1;
          ctx.stroke();

          // 5. Electrons & Trails
          const targetSubSet = new Set(targetSubshells);
          const visibleElectrons = electrons3D.filter((e) => {
            if (!targetSubSet.has(e.subshell)) return false;
            if (
              selectedOrbitalIdx !== 'all' &&
              e.mIndex !== Number(selectedOrbitalIdx)
            ) {
              return false;
            }
            return true;
          });

          visibleElectrons.forEach((e) => {
            const pos = computeElectronPosition3D(e, t);
            if (!tracesRef.current[e.id]) {
              tracesRef.current[e.id] = [];
            }
            const history = tracesRef.current[e.id];
            if (simPlaying || history.length === 0) {
              history.push(pos);
              if (history.length > 48) {
                history.shift();
              }
            }

            if (history.length > 1) {
              for (let k = 1; k < history.length; k++) {
                const p0 = project3D(history[k - 1].x, history[k - 1].y, history[k - 1].z, width, height, cam, maxShellN);
                const p1 = project3D(history[k].x, history[k].y, history[k].z, width, height, cam, maxShellN);
                const age = k / history.length;
                ctx.beginPath();
                ctx.moveTo(p0.sx, p0.sy);
                ctx.lineTo(p1.sx, p1.sy);
                ctx.strokeStyle = e.color;
                ctx.globalAlpha = age * 0.7;
                ctx.lineWidth = Math.max(0.8, 2.0 * age * p1.scale);
                ctx.lineCap = 'round';
                ctx.stroke();
              }
              ctx.globalAlpha = 1.0;
            }

            const proj = project3D(pos.x, pos.y, pos.z, width, height, cam, maxShellN);
            const r = Math.max(2.6, 3.6 * proj.scale);
            ctx.beginPath();
            ctx.arc(proj.sx, proj.sy, r, 0, Math.PI * 2);
            ctx.fillStyle = e.color;
            ctx.fill();
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 0.9;
            ctx.stroke();
          });

          ctx.restore();
          animFrameId = requestAnimationFrame(renderFrame);
        };

        animFrameId = requestAnimationFrame(renderFrame);
        return () => cancelAnimationFrame(animFrameId);
      }, [
        isDark,
        simPlaying,
        shellPlane,
        activeShells,
        orbitalSurfaceFaces,
        targetSubshells,
        selectedOrbitalIdx,
        electrons3D,
        computeElectronPosition3D

      const handlePointerDown = (e) => {
        const rect = canvasRef.current.getBoundingClientRect();
        cameraRef.current.isDragging = true;
        cameraRef.current.lastX = e.clientX - rect.left;
        cameraRef.current.lastY = e.clientY - rect.top;
      };

      const handlePointerMove = (e) => {
        if (!cameraRef.current.isDragging) return;
        const rect = canvasRef.current.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        const dx = x - cameraRef.current.lastX;
        const dy = y - cameraRef.current.lastY;

        cameraRef.current.rotY += dx * 0.0085;
        cameraRef.current.rotX = Math.max(
          -Math.PI / 2 + 0.05,
          Math.min(Math.PI / 2 - 0.05, cameraRef.current.rotX + dy * 0.0085)
        );
        cameraRef.current.lastX = x;
        cameraRef.current.lastY = y;
      };

      const handlePointerUp = () => {
        cameraRef.current.isDragging = false;
      };

      const handleWheel = (e) => {
        e.preventDefault();
        const delta = e.deltaY > 0 ? 0.9 : 1.1;
        cameraRef.current.zoom = Math.max(0.5, Math.min(2.4, cameraRef.current.zoom * delta));

      const activeSubshellOrbitals = useMemo(() => {

      }, [targetSubshells]);

      const currentOrbitalDescription = useMemo(() => {

      const [isDark, setIsDark] = useState(true);

      const [animEnabled, setAnimEnabled] = useState(false);
      const [animPlaying, setAnimPlaying] = useState(false);
      const [animElectronCount, setAnimElectronCount] = useState(26);
      const [animSpeedMs, setAnimSpeedMs] = useState(300);

      const selectedElement = useMemo(() => {
        return ELEMENTS_DATABASE[selectedZ - 1] || ELEMENTS_DATABASE[0];
      }, [selectedZ]);

      const handleSelectElement = useCallback(
        (newZ) => {
          const clamped = Math.max(1, Math.min(118, Number(newZ)));
          setSelectedZ(clamped);
          if (animEnabled) {
            setAnimPlaying(false);
            setAnimElectronCount(1);
          } else {
            setAnimElectronCount(clamped);
          }
        },
        [animEnabled]
      );

      useEffect(() => {
        const handleKeyDown = (e) => {
          if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
          if (e.key === 'ArrowLeft') {
            e.preventDefault();
            handleSelectElement(selectedZ > 1 ? selectedZ - 1 : 118);
          } else if (e.key === 'ArrowRight') {
            e.preventDefault();
            handleSelectElement(selectedZ < 118 ? selectedZ + 1 : 1);
          }
        };
        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, [selectedZ, handleSelectElement]);

      const electronSequence = useMemo(() => {
        return buildElectronSequence(selectedElement.groundSubshells);
      }, [selectedElement]);

      useEffect(() => {
        if (!animEnabled || !animPlaying) return;
        const timer = setInterval(() => {
          setAnimElectronCount((prev) => {
            if (prev >= selectedElement.z) {
              setAnimPlaying(false);
              return selectedElement.z;
            }
            return prev + 1;
          });
        }, animSpeedMs);
        return () => clearInterval(timer);
      }, [animEnabled, animPlaying, animSpeedMs, selectedElement.z]);

      const activeSubshellsMap = useMemo(() => {
        if (!animEnabled) {
          return selectedElement.groundSubshells;
        }
        const partial = {};
        const limit = Math.min(animElectronCount, electronSequence.length);
        for (let i = 0; i < limit; i++) {
          const step = electronSequence[i];
          partial[step.subshell] = (partial[step.subshell] || 0) + 1;
        }
        return partial;
      }, [animEnabled, animElectronCount, electronSequence, selectedElement]);

      const activeOrbitalDiagrams = useMemo(() => {
        let coreSet = new Set();
        if (orbitalFilterMode === 'valence' && selectedElement.z > 2) {
          for (let i = NOBLE_GASES.length - 1; i >= 0; i--) {
            if (NOBLE_GASES[i].z < selectedElement.z) {
              coreSet = new Set(NOBLE_GASES[i].subshells);
              break;
            }
          }
        }
        return SUBSHELL_ORDER
          .filter((sub) => activeSubshellsMap[sub] > 0 && !coreSet.has(sub))
          .map((sub) => generateOrbitalBoxesForSubshell(sub, activeSubshellsMap[sub]));
      }, [activeSubshellsMap, orbitalFilterMode, selectedElement.z]);

      const activeShells = useMemo(() => {
        return computeShellDistribution(activeSubshellsMap);
      }, [activeSubshellsMap]);

      const currentAnimStep = useMemo(() => {
        if (!animEnabled || animElectronCount < 1) return null;
        return electronSequence[Math.min(animElectronCount, electronSequence.length) - 1] || null;
      }, [animEnabled, animElectronCount, electronSequence]);

      const searchMatches = useMemo(() => {
        const q = searchQuery.trim().toLowerCase();
        if (!q) return null;
        return new Set(
          ELEMENTS_DATABASE.filter(
            (el) =>
              el.name.toLowerCase().includes(q) ||
              el.symbol.toLowerCase() === q ||
              el.symbol.toLowerCase().includes(q) ||
              String(el.z) === q
          ).map((el) => el.z)
        );
      }, [searchQuery]);

      const handleSearchSubmit = (e) => {
        e.preventDefault();
        const q = searchQuery.trim().toLowerCase();
        if (!q) return;
        const exactZ = parseInt(q, 10);
        if (!isNaN(exactZ) && exactZ >= 1 && exactZ <= 118) {
          handleSelectElement(exactZ);
          return;
        }
        const exactSymbol = ELEMENTS_DATABASE.find((el) => el.symbol.toLowerCase() === q);
        if (exactSymbol) {
          handleSelectElement(exactSymbol.z);
          return;
        }
        const nameMatch = ELEMENTS_DATABASE.find((el) => el.name.toLowerCase().includes(q));
        if (nameMatch) {
          handleSelectElement(nameMatch.z);
        }
      };

      const handleCopy = (text, key) => {
        try {
          const textarea = document.createElement('textarea');
          textarea.value = text;
          textarea.style.position = 'fixed';
          textarea.style.opacity = '0';
          document.body.appendChild(textarea);
          textarea.select();
          document.execCommand('copy');
          document.body.removeChild(textarea);
        } catch {
          if (navigator.clipboard) navigator.clipboard.writeText(text);
        }
        setCopiedKey(key);
        setTimeout(() => setCopiedKey(null), 1600);
      };

      const mainGridRows = useMemo(() => {
        const grid = Array.from({ length: 7 }, () => Array(18).fill(null));
        for (const el of ELEMENTS_DATABASE) {
          if (el.z >= 58 && el.z <= 71) continue;
          if (el.z >= 90 && el.z <= 103) continue;
          if (el.period >= 1 && el.period <= 7 && el.group >= 1 && el.group <= 18) {
            grid[el.period - 1][el.group - 1] = el;
          }
        }
        return grid;
      }, []);

      const lanthanidesRow = useMemo(
        () => ELEMENTS_DATABASE.filter((el) => el.z >= 58 && el.z <= 71),
        []
      );
      const actinidesRow = useMemo(
        () => ELEMENTS_DATABASE.filter((el) => el.z >= 90 && el.z <= 103),
        []
      );

      const renderElementTile = (el) => {
        const isSelected = el.z === selectedZ;
        const bStyle = BLOCK_STYLES[el.block];

        let isDimmed = false;
        if (searchMatches && !searchMatches.has(el.z)) {
          isDimmed = true;
        }
        if (blockFilter !== 'all') {
          if (blockFilter === 'anomalous' && !el.isAnomalous) isDimmed = true;
          else if (blockFilter !== 'anomalous' && el.block !== blockFilter) isDimmed = true;
        }

        return (
          <button
            key={`el-${el.z}`}
            type="button"
            onClick={() => handleSelectElement(el.z)}
            className={`relative flex flex-col justify-between p-1.5 rounded-lg border text-left transition-all select-none h-12 sm:h-[52px] w-full ${
              isDark ? bStyle.darkTile : bStyle.lightTile
            } ${
              isSelected
                ? isDark
                  ? 'ring-2 ring-[#a8c7fa] border-[#a8c7fa] z-10 scale-[1.04]'
                  : 'ring-2 ring-[#0b57d0] border-[#0b57d0] z-10 scale-[1.04]'
                : ''
            } ${isDimmed ? 'opacity-20' : 'opacity-100'}`}
            title={`${el.z}. ${el.name} (${el.symbol}) — ${el.nobleConfigAufbau}`}
          >
            <div className="flex items-center justify-between w-full leading-none">
              <span className="text-[9px] font-mono opacity-75">{el.z}</span>
              {el.isAnomalous && (
                <span className="w-1.5 h-1.5 rounded-full bg-amber-400" />
              )}
            </div>

            <div className="text-xs sm:text-[13px] font-semibold font-mono tracking-tight leading-none my-auto">
              {el.symbol}
            </div>

            <div className="text-[7px] sm:text-[8px] truncate w-full opacity-70 leading-none">
              {el.name}
            </div>
          </button>
        );
      };

      return (
        <div
          className={`min-h-screen transition-colors ${
            isDark ? 'bg-[#131314] text-[#e3e3e3]' : 'bg-[#f8fafd] text-[#1f1f1f]'
          }`}
        >
          {/* Header */}
          <header
            className={`sticky top-0 z-30 border-b backdrop-blur-md ${
              isDark
                ? 'bg-[#131314]/90 border-[#2d2f31]'
                : 'bg-[#f8fafd]/90 border-[#e3e8ef]'
            }`}
          >
            <div className="max-w-[1560px] mx-auto px-4 sm:px-6 py-3 flex flex-wrap items-center justify-between gap-3">
              <div className="flex flex-wrap items-center gap-2.5">
                <div
                  className={`inline-flex items-center rounded-full border p-1 ${
                    isDark ? 'bg-[#1e1f20] border-[#2d2f31]' : 'bg-white border-[#dde3ea]'
                  }`}
                >
                  <button
                    type="button"
                    onClick={() => setActiveView('simulator')}
                    className={`px-3.5 py-1.5 rounded-full text-xs sm:text-sm font-semibold transition-colors ${
                      activeView === 'simulator'
                        ? isDark
                          ? 'bg-[#a8c7fa] text-[#041e49]'
                          : 'bg-[#0b57d0] text-white'
                        : isDark
                        ? 'text-[#c4c7c5] hover:text-white'
                        : 'text-[#444746] hover:text-black'
                    }`}
                  >
                    Atomic Simulator
                  </button>
                  <button
                    type="button"
                    onClick={() => setActiveView('theory')}
                    className={`px-3.5 py-1.5 rounded-full text-xs sm:text-sm font-semibold transition-colors ${
                      activeView === 'theory'
                        ? isDark
                          ? 'bg-[#a8c7fa] text-[#041e49]'
                          : 'bg-[#0b57d0] text-white'
                        : isDark
                        ? 'text-[#c4c7c5] hover:text-white'
                        : 'text-[#444746] hover:text-black'
                    }`}
                  >
                    Quantum No. & Electronic Configuration
                  </button>
                </div>

                <span
                  className={`text-xs px-2.5 py-0.5 rounded-full font-mono hidden sm:inline-block ${
                    isDark
                      ? 'bg-[#1e1f20] text-[#c4c7c5] border border-[#2d2f31]'
                      : 'bg-[#e8eef5] text-[#444746]'
                  }`}
                >
                  Z = 1–118
                </span>
              </div>

              <div className="flex flex-wrap items-center gap-2">
                <form onSubmit={handleSearchSubmit} className="relative">
                  <Search className="w-3.5 h-3.5 absolute left-3.5 top-1/2 -translate-y-1/2 opacity-50" />
                  <input
                    type="text"
                    value={searchQuery}
                    onChange={(e) => setSearchQuery(e.target.value)}
                    placeholder="Search element or Z..."
                    aria-label="Search elements"
                    className={`pl-9 pr-7 py-1.5 text-xs rounded-full border w-44 sm:w-56 focus:outline-none transition-colors ${
                      isDark
                        ? 'bg-[#1e1f20] border-[#2d2f31] text-[#e3e3e3] placeholder-[#8e918f] focus:border-[#a8c7fa]'
                        : 'bg-white border-[#dde3ea] text-[#1f1f1f] placeholder-[#747775] focus:border-[#0b57d0]'
                    }`}
                  />
                  {searchQuery && (
                    <button
                      type="button"
                      onClick={() => setSearchQuery('')}
                      className="absolute right-3 top-1/2 -translate-y-1/2 text-xs opacity-50 hover:opacity-100"
                    >
                      ✕
                    </button>
                  )}
                </form>

                <div
                  className={`inline-flex items-center rounded-full border p-0.5 ${
                    isDark ? 'bg-[#1e1f20] border-[#2d2f31]' : 'bg-white border-[#dde3ea]'
                  }`}
                >
                  <button
                    type="button"
                    onClick={() => handleSelectElement(selectedZ > 1 ? selectedZ - 1 : 118)}
                    className="p-1.5 rounded-full hover:opacity-80 transition-opacity"
                    title="Previous Element"
                  >
                    <ChevronLeft className="w-3.5 h-3.5" />
                  </button>
                  <span className="px-2.5 text-xs font-mono font-medium">
                    {selectedElement.z} · {selectedElement.symbol}
                  </span>
                  <button
                    type="button"
                    onClick={() => handleSelectElement(selectedZ < 118 ? selectedZ + 1 : 1)}
                    className="p-1.5 rounded-full hover:opacity-80 transition-opacity"
                    title="Next Element"
                  >
                    <ChevronRight className="w-3.5 h-3.5" />
                  </button>
                </div>

                <button
                  type="button"
                  onClick={() => setIsDark(!isDark)}
                  className={`p-2 rounded-full border transition-colors ${
                    isDark
                      ? 'bg-[#1e1f20] border-[#2d2f31] text-[#e3e3e3] hover:bg-[#282a2c]'
                      : 'bg-white border-[#dde3ea] text-[#1f1f1f] hover:bg-[#f0f4f9]'
                  }`}
                  title="Toggle Theme"
                  aria-label="Toggle Theme"
                >
                  {isDark ? <Sun className="w-3.5 h-3.5" /> : <Moon className="w-3.5 h-3.5" />}
                </button>
              </div>
            </div>
          </header>

          {/* Main Content Area */}
          <main className="max-w-[1560px] mx-auto px-4 sm:px-6 py-5 space-y-5">
            {activeView === 'theory' ? (
              <QuantumTheoryView
                isDark={isDark}
                onSelectElementInSimulator={(z) => {
                  handleSelectElement(z);
                  setActiveView('simulator');
                }}
              />
            ) : (
              <>
                {/* Control bar */}
                <section
                  className={`rounded-3xl border px-5 py-3.5 flex flex-col md:flex-row md:items-center justify-between gap-4 ${
                    isDark ? 'bg-[#1e1f20] border-[#2d2f31]' : 'bg-white border-[#e3e8ef]'
                  }`}
                >
                  <div className="flex-1 flex items-center gap-3">
                    <span className="text-xs font-medium opacity-70 whitespace-nowrap">
                      Atomic Number
                    </span>
                    <span className="text-xs font-mono opacity-50">1</span>
                    <input
                      id="z-slider"
                      type="range"
                      min={1}
                      max={118}
                      value={selectedZ}
                      onChange={(e) => handleSelectElement(Number(e.target.value))}
                      className="w-full accent-[#a8c7fa] cursor-pointer h-1.5 rounded-lg"
                    />
                    <span className="text-xs font-mono opacity-50">118</span>
                  </div>

                  <div className="flex flex-wrap items-center gap-1.5">
                    {[
                      { id: 'all', label: 'All' },
                      { id: 's', label: 's-block' },
                      { id: 'p', label: 'p-block' },
                      { id: 'd', label: 'd-block' },
                      { id: 'f', label: 'f-block' },
                      { id: 'anomalous', label: 'Exceptions' }
                    ].map((blk) => {
                      const active = blockFilter === blk.id;
                      return (
                        <button
                          key={blk.id}
                          type="button"
                          onClick={() => setBlockFilter(blk.id)}
                          className={`px-3 py-1 rounded-full text-xs font-medium transition-colors ${
                            active
                              ? isDark
                                ? 'bg-[#a8c7fa] text-[#041e49]'
                                : 'bg-[#0b57d0] text-white'
                              : isDark
                              ? 'bg-[#131314] text-[#c4c7c5] hover:bg-[#282a2c]'
                              : 'bg-[#f0f4f9] text-[#444746] hover:bg-[#e1e6ec]'
                          }`}
                        >
                          {blk.label}
                        </button>
                      );
                    })}
                  </div>
                </section>

                {/* Periodic Table Grid */}
                <section
                  className={`rounded-3xl border p-4 overflow-x-auto ${
                    isDark ? 'bg-[#1e1f20] border-[#2d2f31]' : 'bg-white border-[#e3e8ef]'
                  }`}
                >
                  <div className="min-w-[860px]">
                    <div className="grid grid-cols-[24px_repeat(18,minmax(0,1fr))] gap-1 mb-1">
                      <div className="text-[10px] font-mono opacity-40 text-center" />
                      {Array.from({ length: 18 }, (_, i) => (
                        <div key={i + 1} className="text-[10px] font-mono opacity-45 text-center">
                          {i + 1}
                        </div>
                      ))}
                    </div>

                    <div className="space-y-1">
                      {mainGridRows.map((row, pIdx) => (
                        <div
                          key={pIdx + 1}
                          className="grid grid-cols-[24px_repeat(18,minmax(0,1fr))] gap-1 items-center"
                        >
                          <div className="text-[11px] font-mono opacity-45 text-center">
                            {pIdx + 1}
                          </div>

                          {row.map((cell, gIdx) => {
                            if (!cell) {
                              return <div key={`empty-${pIdx}-${gIdx}`} className="h-12 sm:h-[52px]" />;
                            }
                            return renderElementTile(cell);
                          })}
                        </div>
                      ))}
                    </div>

                    <div className="mt-3 pt-2.5 border-t border-[#2d2f31]/40 space-y-1">
                      <div className="grid grid-cols-[24px_repeat(18,minmax(0,1fr))] gap-1 items-center">
                        <div className="text-[10px] font-mono opacity-45 text-center">4f</div>
                        <div className="col-span-3 pr-2 text-right text-[10px] font-mono opacity-55">
                          58–71 (Ce–Lu)
                        </div>
                        {lanthanidesRow.map((el) => renderElementTile(el))}
                        <div className="col-span-1" />
                      </div>

                      <div className="grid grid-cols-[24px_repeat(18,minmax(0,1fr))] gap-1 items-center">
                        <div className="text-[10px] font-mono opacity-45 text-center">5f</div>
                        <div className="col-span-3 pr-2 text-right text-[10px] font-mono opacity-55">
                          90–103 (Th–Lr)
                        </div>
                        {actinidesRow.map((el) => renderElementTile(el))}
                        <div className="col-span-1" />
                      </div>
                    </div>
                  </div>
                </section>

                {/* Unified Element Overview Card */}
                <section
                  className={`rounded-3xl border p-5 ${
                    isDark ? 'bg-[#1e1f20] border-[#2d2f31]' : 'bg-white border-[#e3e8ef]'
                  }`}
                >
                  <div className="grid grid-cols-1 lg:grid-cols-12 gap-5 items-center">
                    <div className="lg:col-span-7 space-y-4">
                      <div className="flex flex-wrap items-center justify-between gap-3">
                        <div>
                          <div className="flex items-center gap-2.5">
                            <h2 className="text-2xl sm:text-3xl font-bold tracking-tight">
                              {selectedElement.name}
                            </h2>
                            <span
                              className={`px-2.5 py-0.5 text-xs font-mono font-semibold rounded-full ${
                                isDark
                                  ? BLOCK_STYLES[selectedElement.block].pillDark
                                  : BLOCK_STYLES[selectedElement.block].pillLight
                              }`}
                            >
                              {selectedElement.symbol} · Z={selectedElement.z}
                            </span>
                          </div>
                          <p className="text-xs opacity-60 mt-1">
                            {selectedElement.category} · Period {selectedElement.period} ·{' '}
                            {selectedElement.group ? `Group ${selectedElement.group}` : 'f-block'} ·{' '}
                            {selectedElement.block}-block
                          </p>
                        </div>

                        <div className="flex flex-wrap items-center gap-1.5">
                          {selectedElement.shells.map((sh) => (
                            <span
                              key={sh.n}
                              className={`px-2.5 py-1 rounded-xl border text-xs font-mono ${
                                isDark
                                  ? 'bg-[#131314] border-[#2d2f31] text-[#c4c7c5]'
                                  : 'bg-[#f8fafd] border-[#e3e8ef] text-[#444746]'
                              }`}
                            >
                              <strong>{sh.letter}</strong>={sh.count}
                            </span>
                          ))}
                        </div>
                      </div>

                      <div className="grid grid-cols-2 sm:grid-cols-4 gap-2.5 text-xs font-mono">
                        {[
                          { label: 'Atomic Mass', val: `${selectedElement.mass} u` },
                          { label: 'Electrons', val: `${selectedElement.z} e⁻` },
                          {
                            label: 'Unpaired',
                            val: `${selectedElement.totalUnpaired} (${selectedElement.magneticCharacter})`
                          },
                          {
                            label: 'Multiplicity',
                            val: `2S+1 = ${selectedElement.spinMultiplicity}`
                          }
                        ].map((item) => (
                          <div
                            key={item.label}
                            className={`p-2.5 rounded-2xl border ${
                              isDark
                                ? 'bg-[#131314] border-[#2d2f31]'
                                : 'bg-[#f8fafd] border-[#e3e8ef]'
                            }`}
                          >
                            <div className="text-[10px] opacity-55">{item.label}</div>
                            <div className="text-xs font-semibold mt-0.5 truncate">{item.val}</div>
                          </div>
                        ))}
                      </div>

                      {(selectedElement.isAnomalous || selectedElement.isSuperheavy) && (
                        <div
                          className={`px-3.5 py-2.5 rounded-2xl text-xs border flex flex-wrap items-center gap-2 ${
                            isDark
                              ? 'bg-[#131314] border-[#2d2f31] text-[#c4c7c5]'
                              : 'bg-[#f0f4f9] border-[#dde3ea] text-[#444746]'
                          }`}
                        >
                          <span className="font-semibold text-amber-400">
                            {selectedElement.statusLabel}:
                          </span>
                          <span className="opacity-85">{selectedElement.statusNote}</span>
                        </div>
                      )}
                    </div>

                    <div className="lg:col-span-5 grid grid-cols-1 gap-2.5">
                      <div
                        className={`p-3.5 rounded-2xl border ${
                          isDark ? 'bg-[#131314] border-[#2d2f31]' : 'bg-[#f8fafd] border-[#e3e8ef]'
                        }`}
                      >
                        <div className="flex items-center justify-between mb-1">
                          <span className="text-[11px] opacity-55">Noble-Gas Configuration</span>
                          <button
                            type="button"
                            onClick={() => handleCopy(selectedElement.nobleConfigAufbau, 'noble')}
                            className="flex items-center gap-1 text-[11px] opacity-65 hover:opacity-100 transition-opacity"
                          >
                            {copiedKey === 'noble' ? (
                              <>
                                <Check className="w-3 h-3" />
                                <span>Copied</span>
                              </>
                            ) : (
                              <>
                                <Copy className="w-3 h-3" />
                                <span>Copy</span>
                              </>
                            )}
                          </button>
                        </div>
                        <div
                          className={`text-base font-mono font-semibold tracking-wide break-words ${
                            isDark ? 'text-[#a8c7fa]' : 'text-[#0b57d0]'
                          }`}
                        >
                          {selectedElement.nobleConfigAufbau}
                        </div>
                      </div>

                      <div
                        className={`p-3.5 rounded-2xl border ${
                          isDark ? 'bg-[#131314] border-[#2d2f31]' : 'bg-[#f8fafd] border-[#e3e8ef]'
                        }`}
                      >
                        <div className="flex items-center justify-between mb-1">
                          <span className="text-[11px] opacity-55">Full Shell Configuration</span>
                          <button
                            type="button"
                            onClick={() => handleCopy(selectedElement.fullConfigShell, 'full')}
                            className="flex items-center gap-1 text-[11px] opacity-65 hover:opacity-100 transition-opacity"
                          >
                            {copiedKey === 'full' ? (
                              <>
                                <Check className="w-3 h-3" />
                                <span>Copied</span>
                              </>
                            ) : (
                              <>
                                <Copy className="w-3 h-3" />
                                <span>Copy</span>
                              </>
                            )}
                          </button>
                        </div>
                        <div className="text-xs sm:text-sm font-mono font-medium leading-relaxed break-words opacity-90">
                          {selectedElement.fullConfigShell}
                        </div>
                      </div>
                    </div>
                  </div>
                </section>

                {/* 3D Visualizer & Orbital Filling Section */}
                <div className="grid grid-cols-1 lg:grid-cols-12 gap-5 items-stretch">
                  <div
                    className={`lg:col-span-6 rounded-3xl border p-5 flex flex-col ${
                      isDark ? 'bg-[#1e1f20] border-[#2d2f31]' : 'bg-white border-[#e3e8ef]'
                    }`}
                  >
                    <Interactive3DAtomSimulator
                      element={selectedElement}
                      activeSubshellsMap={activeSubshellsMap}
                      activeShells={activeShells}
                      isDark={isDark}
                    />
                  </div>

                  <div
                    className={`lg:col-span-6 rounded-3xl border p-5 flex flex-col space-y-4 ${
                      isDark ? 'bg-[#1e1f20] border-[#2d2f31]' : 'bg-white border-[#e3e8ef]'
                    }`}
                  >
                    <div className="flex flex-wrap items-center justify-between gap-2">
                      <div className="flex items-center gap-2">
                        <h3 className="text-sm font-semibold">
                          Orbital Box Diagram · {selectedElement.symbol}
                        </h3>
                        <button
                          type="button"
                          onClick={() =>
                            setOrbitalFilterMode(orbitalFilterMode === 'all' ? 'valence' : 'all')
                          }
                          className={`px-2.5 py-1 rounded-full text-[11px] font-mono border transition-colors ${
                            orbitalFilterMode === 'valence'
                              ? isDark
                                ? 'bg-[#a8c7fa] text-[#041e49] border-transparent'
                                : 'bg-[#0b57d0] text-white border-transparent'
                              : isDark
                              ? 'bg-[#131314] border-[#2d2f31] text-[#c4c7c5]'
                              : 'bg-[#f0f4f9] border-[#dde3ea] text-[#444746]'
                          }`}
                        >
                          {orbitalFilterMode === 'all' ? 'All Subshells' : 'Valence Only'}
                        </button>
                      </div>

                      <div className="flex items-center gap-1.5">
                        <button
                          type="button"
                          onClick={() => {
                            const nextState = !animEnabled;
                            setAnimEnabled(nextState);
                            if (nextState) {
                              setAnimElectronCount(1);
                              setAnimPlaying(true);
                            } else {
                              setAnimPlaying(false);
                              setAnimElectronCount(selectedElement.z);
                            }
                          }}
                          className={`px-3 py-1 rounded-full text-xs font-medium flex items-center gap-1.5 transition-colors ${
                            animEnabled
                              ? isDark
                                ? 'bg-[#a8c7fa] text-[#041e49]'
                                : 'bg-[#0b57d0] text-white'
                              : isDark
                              ? 'bg-[#131314] border border-[#2d2f31] text-[#e3e3e3] hover:bg-[#282a2c]'
                              : 'bg-[#f0f4f9] text-[#1f1f1f] hover:bg-[#e1e6ec]'
                          }`}
                        >
                          <Play className="w-3 h-3" />
                          <span>{animEnabled ? 'Stop Filling' : 'Simulate Filling'}</span>
                        </button>
                      </div>
                    </div>

                    {animEnabled && (
                      <div
                        className={`px-3.5 py-2 rounded-2xl border flex flex-wrap items-center justify-between gap-2 text-xs font-mono ${
                          isDark ? 'bg-[#131314] border-[#2d2f31]' : 'bg-[#f8fafd] border-[#e3e8ef]'
                        }`}
                      >
                        <div className="flex items-center gap-1">
                          <button
                            type="button"
                            onClick={() => {
                              setAnimPlaying(false);
                              setAnimElectronCount(1);
                            }}
                            className="p-1 rounded-full hover:opacity-75"
                            title="Reset"
                          >
                            <RotateCcw className="w-3.5 h-3.5" />
                          </button>
                          <button
                            type="button"
                            onClick={() => {
                              setAnimPlaying(false);
                              setAnimElectronCount((c) => Math.max(1, c - 1));
                            }}
                            className="p-1 rounded-full hover:opacity-75"
                            title="Previous electron"
                          >
                            <SkipBack className="w-3.5 h-3.5" />
                          </button>
                          <button
                            type="button"
                            onClick={() => {
                              if (animElectronCount >= selectedElement.z) {
                                setAnimElectronCount(1);
                                setAnimPlaying(true);
                              } else {
                                setAnimPlaying(!animPlaying);
                              }
                            }}
                            className="px-2.5 py-0.5 rounded-full bg-emerald-500/20 text-emerald-400 text-xs font-medium flex items-center gap-1"
                          >
                            {animPlaying ? <Pause className="w-3 h-3" /> : <Play className="w-3 h-3" />}
                            <span>{animPlaying ? 'Pause' : 'Play'}</span>
                          </button>
                          <button
                            type="button"
                            onClick={() => {
                              setAnimPlaying(false);
                              setAnimElectronCount((c) => Math.min(selectedElement.z, c + 1));
                            }}
                            className="p-1 rounded-full hover:opacity-75"
                            title="Next electron"
                          >
                            <SkipForward className="w-3.5 h-3.5" />
                          </button>
                        </div>

                        <div className="flex items-center gap-2">
                          <span>
                            {animElectronCount}/{selectedElement.z} e⁻
                          </span>
                          {currentAnimStep && (
                            <span className="opacity-70">
                              · {currentAnimStep.subshell} (m_l={currentAnimStep.ml}, {currentAnimStep.ms})
                            </span>
                          )}
                          <div className="flex items-center gap-1">
                            {[
                              { label: '0.5x', ms: 600 },
                              { label: '1x', ms: 300 },
                              { label: '2x', ms: 150 }
                            ].map((sp) => (
                              <button
                                key={sp.label}
                                type="button"
                                onClick={() => setAnimSpeedMs(sp.ms)}
                                className={`px-2 py-0.5 rounded-full text-[10px] ${
                                  animSpeedMs === sp.ms
                                    ? isDark
                                      ? 'bg-[#a8c7fa] text-[#041e49]'
                                      : 'bg-[#0b57d0] text-white'
                                    : 'opacity-60'
                                }`}
                              >
                                {sp.label}
                              </button>
                            ))}
                          </div>
                        </div>
                      </div>
                    )}

                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 max-h-[420px] overflow-y-auto pr-1 flex-1 content-start">
                      {activeOrbitalDiagrams.map((diag) => (
                        <SubshellOrbitalCard
                          key={diag.subshell}
                          diagram={diag}
                          isHighlighted={
                            animEnabled &&
                            currentAnimStep &&
                            currentAnimStep.subshell === diag.subshell
                          }
                          isDark={isDark}
                        />
                      ))}
                    </div>
                  </div>
                </div>
              </>
            )}
          </main>
        </div>
      );
    }

    const rootElement = document.getElementById('root');
    const root = ReactDOM.createRoot(rootElement);
    root.render(<App />);
  </script>
</body>
</html>
