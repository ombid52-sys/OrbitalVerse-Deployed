            </h2>

            <div className="grid grid-cols-1 lg:grid-cols-3 gap-4 mb-5">
              {FILLING_RULES.map((rule) => (
                <div key={rule.title} className={`${subCardClass} space-y-2`}>
                  <h3 className={`text-sm font-bold ${isDark ? 'text-[#a8c7fa]' : 'text-[#0b57d0]'}`}>{rule.title}</h3>
                  <p className={`text-xs leading-relaxed ${isDark ? 'text-slate-300' : 'text-slate-700'}`}>{rule.summary}</p>
                  <ul className={`space-y-1 text-xs pt-1 ${isDark ? 'text-slate-400' : 'text-slate-600'}`}>
                    {rule.points.map((pt, i) => (
                      <li key={i} className="leading-relaxed">• {pt}</li>
                    ))}
                  </ul>
                </div>
              ))}
            </div>

            <div className={subCardClass}>
              <div className="mb-3">
                <h3 className={`text-sm font-bold tracking-tight ${isDark ? 'text-white' : 'text-slate-900'}`}>
                  Energy Sequence of Subshells
                </h3>
              </div>
              <PeriodicSubshellBlockMap isDark={isDark} />
            </div>
          </section>

          <section className={cardClass}>
            <div className="flex flex-wrap items-center justify-between gap-2 mb-4">
              <h2 className={`text-lg sm:text-xl font-bold tracking-tight ${isDark ? 'text-white' : 'text-slate-900'}`}>
                Anomalous Ground-State Configurations
              </h2>
            </div>

            <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
              {KEY_EXCEPTIONS.map((ex) => (
                <button
                  key={ex.z}
                  type="button"
                  onClick={() => onSelectElementInSimulator(ex.z)}
                  className={`${subCardClass} text-left transition-all hover:border-[#a8c7fa] group flex flex-col justify-between gap-2`}
                >
                  <div className="flex items-center justify-between gap-2 w-full">
                    <div className="flex items-center gap-2">
                      <span className={`px-2 py-0.5 rounded-md text-xs font-mono font-bold ${isDark ? 'bg-amber-500/20 text-amber-400' : 'bg-amber-100 text-amber-800'}`}>
                        Z={ex.z} · {ex.sym}
                      </span>
                      <span className={`text-xs font-semibold ${isDark ? 'text-slate-200' : 'text-slate-900'}`}>
                        {ELEMENTS_DATABASE[ex.z - 1]?.name}
                      </span>
                    </div>
                    <span className={`text-[10px] font-mono px-2 py-0.5 rounded-full border ${isDark ? 'border-[#2d2f31] text-slate-400' : 'border-[#d0d7de] text-slate-600'} group-hover:opacity-100`}>
                      {ex.tag} ↗
                    </span>
                  </div>

                  <div className="grid grid-cols-2 gap-2 text-xs font-mono pt-1">
                    <div>
                      <span className={`text-[10px] block ${isDark ? 'text-slate-400' : 'text-slate-500'}`}>Predicted (Aufbau)</span>
                      <span className="line-through text-slate-500">{ex.expected}</span>
                    </div>
                    <div>
                      <span className={`text-[10px] block ${isDark ? 'text-slate-400' : 'text-slate-500'}`}>Observed Ground State</span>
                      <span className={isDark ? 'text-[#a8c7fa] font-semibold' : 'text-[#0b57d0] font-semibold'}>
                        {ex.actual}
                      </span>
                    </div>
                  </div>

                  <p className={`text-[11px] leading-relaxed ${isDark ? 'text-slate-400' : 'text-slate-600'}`}>
                    {ANOMALOUS_CONFIGS[ex.z]?.reason}
                  </p>
                </button>
              ))}
            </div>
          </section>
        </div>
      );
    }

    function App() {
      const [activeView, setActiveView] = useState('trends');
      const [selectedZ, setSelectedZ] = useState(26);
      const [searchQuery, setSearchQuery] = useState('');
      const [blockFilter, setBlockFilter] = useState('all');
      const [orbitalFilterMode, setOrbitalFilterMode] = useState('all');
      const [copiedKey, setCopiedKey] = useState(null);
      const [isDark, setIsDark] = useState(true);

      const [animEnabled, setAnimEnabled] = useState(false);
      const [animPlaying, setAnimPlaying] = useState(false);
      const [animElectronCount, setAnimElectronCount] = useState(26);
      const [animSpeedMs, setAnimSpeedMs] = useState(300);

      const selectedElement = useMemo(() => {
        return ELEMENTS_DATABASE[selectedZ - 1] || ELEMENTS_DATABASE[0];
      }, [selectedZ]);

      const handleSelectElement = useCallback(
        (newZ) => {
          const clamped = Math.max(1, Math.min(118, Number(newZ)));
          setSelectedZ(clamped);
          if (animEnabled) {
            setAnimPlaying(false);
            setAnimElectronCount(1);
          } else {
            setAnimElectronCount(clamped);
          }
        },
        [animEnabled]
      );

      useEffect(() => {
        const handleKeyDown = (e) => {
          if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
          if (e.key === 'ArrowLeft') {
            e.preventDefault();
            handleSelectElement(selectedZ > 1 ? selectedZ - 1 : 118);
          } else if (e.key === 'ArrowRight') {
            e.preventDefault();
            handleSelectElement(selectedZ < 118 ? selectedZ + 1 : 1);
          }
        };
        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, [selectedZ, handleSelectElement]);

      const electronSequence = useMemo(() => {
        return buildElectronSequence(selectedElement.groundSubshells);
      }, [selectedElement]);

      useEffect(() => {
        if (!animEnabled || !animPlaying) return;
        const timer = setInterval(() => {
          setAnimElectronCount((prev) => {
            if (prev >= selectedElement.z) {
              setAnimPlaying(false);
              return selectedElement.z;
            }
            return prev + 1;
          });
        }, animSpeedMs);
        return () => clearInterval(timer);
      }, [animEnabled, animPlaying, animSpeedMs, selectedElement.z]);

      const activeSubshellsMap = useMemo(() => {
        if (!animEnabled) {
          return selectedElement.groundSubshells;
        }
        const partial = {};
        const limit = Math.min(animElectronCount, electronSequence.length);
        for (let i = 0; i < limit; i++) {
          const step = electronSequence[i];
          partial[step.subshell] = (partial[step.subshell] || 0) + 1;
        }
        return partial;
      }, [animEnabled, animElectronCount, electronSequence, selectedElement]);

      const activeOrbitalDiagrams = useMemo(() => {
        let coreSet = new Set();
        if (orbitalFilterMode === 'valence' && selectedElement.z > 2) {
          for (let i = NOBLE_GASES.length - 1; i >= 0; i--) {
            if (NOBLE_GASES[i].z < selectedElement.z) {
              coreSet = new Set(NOBLE_GASES[i].subshells);
              break;
            }
          }
        }
        return SUBSHELL_ORDER
          .filter((sub) => activeSubshellsMap[sub] > 0 && !coreSet.has(sub))
          .map((sub) => generateOrbitalBoxesForSubshell(sub, activeSubshellsMap[sub]));
      }, [activeSubshellsMap, orbitalFilterMode, selectedElement.z]);

      const activeShells = useMemo(() => {
        return computeShellDistribution(activeSubshellsMap);
      }, [activeSubshellsMap]);

      const currentAnimStep = useMemo(() => {
        if (!animEnabled || animElectronCount < 1) return null;
        return electronSequence[Math.min(animElectronCount, electronSequence.length) - 1] || null;
      }, [animEnabled, animElectronCount, electronSequence]);

      const searchMatches = useMemo(() => {
        const q = searchQuery.trim().toLowerCase();
        if (!q) return null;
        return new Set(
          ELEMENTS_DATABASE.filter(
            (el) =>
              el.name.toLowerCase().includes(q) ||
              el.symbol.toLowerCase() === q ||
              el.symbol.toLowerCase().includes(q) ||
              String(el.z) === q
          ).map((el) => el.z)
        );
      }, [searchQuery]);

      const handleSearchSubmit = (e) => {
        e.preventDefault();
        const q = searchQuery.trim().toLowerCase();
        if (!q) return;
        const exactZ = parseInt(q, 10);
        if (!isNaN(exactZ) && exactZ >= 1 && exactZ <= 118) {
          handleSelectElement(exactZ);
          return;
        }
        const exactSymbol = ELEMENTS_DATABASE.find((el) => el.symbol.toLowerCase() === q);
        if (exactSymbol) {
          handleSelectElement(exactSymbol.z);
          return;
        }
        const nameMatch = ELEMENTS_DATABASE.find((el) => el.name.toLowerCase().includes(q));
        if (nameMatch) {
          handleSelectElement(nameMatch.z);
        }
      };

      const handleCopy = (text, key) => {
        try {
          const textarea = document.createElement('textarea');
          textarea.value = text;
          textarea.style.position = 'fixed';
          textarea.style.opacity = '0';
          document.body.appendChild(textarea);
          textarea.select();
          document.execCommand('copy');
          document.body.removeChild(textarea);
        } catch {
          if (navigator.clipboard) navigator.clipboard.writeText(text);
        }
        setCopiedKey(key);
        setTimeout(() => setCopiedKey(null), 1600);
      };

      const mainGridRows = useMemo(() => {
        const grid = Array.from({ length: 7 }, () => Array(18).fill(null));
        for (const el of ELEMENTS_DATABASE) {
          if (el.z >= 58 && el.z <= 71) continue;
          if (el.z >= 90 && el.z <= 103) continue;
          if (el.period >= 1 && el.period <= 7 && el.group >= 1 && el.group <= 18) {
            grid[el.period - 1][el.group - 1] = el;
          }
        }
        return grid;
      }, []);

      const lanthanidesRow = useMemo(
        () => ELEMENTS_DATABASE.filter((el) => el.z >= 58 && el.z <= 71),
        []
      );
      const actinidesRow = useMemo(
        () => ELEMENTS_DATABASE.filter((el) => el.z >= 90 && el.z <= 103),
        []
      );

      const renderElementTile = (el) => {
        const isSelected = el.z === selectedZ;
        const bStyle = BLOCK_STYLES[el.block];

        let isDimmed = false;
        if (searchMatches && !searchMatches.has(el.z)) {
          isDimmed = true;
        }
        if (blockFilter !== 'all') {
          if (blockFilter === 'anomalous' && !el.isAnomalous) isDimmed = true;
          else if (blockFilter !== 'anomalous' && el.block !== blockFilter) isDimmed = true;
        }

        return (
          <button
            key={`el-${el.z}`}
            type="button"
            onClick={() => handleSelectElement(el.z)}
            className={`relative flex flex-col justify-between p-1.5 rounded-lg border text-left transition-all select-none h-12 sm:h-[52px] w-full ${
              isDark ? bStyle.darkTile : bStyle.lightTile
            } ${
              isSelected
                ? isDark
                  ? 'ring-2 ring-[#a8c7fa] border-[#a8c7fa] z-10 scale-[1.04]'
                  : 'ring-2 ring-[#0b57d0] border-[#0b57d0] z-10 scale-[1.04]'
                : ''
            } ${isDimmed ? 'opacity-20' : 'opacity-100'}`}
            title={`${el.z}. ${el.name} (${el.symbol}) — ${el.nobleConfigAufbau}`}
          >
            <div className="flex items-center justify-between w-full leading-none">
              <span className="text-[9px] font-mono opacity-75">{el.z}</span>
              {el.isAnomalous && (
                <span className="w-1.5 h-1.5 rounded-full bg-amber-400" />
              )}
            </div>

            <div className="text-xs sm:text-[13px] font-semibold font-mono tracking-tight leading-none my-auto">
              {el.symbol}
            </div>

            <div className="text-[7px] sm:text-[8px] truncate w-full opacity-70 leading-none">
              {el.name}
            </div>
          </button>
        );
      };

      return (
        <div
          className={`min-h-screen transition-colors ${
            isDark ? 'bg-[#131314] text-[#e3e3e3]' : 'bg-[#f8fafd] text-[#1f1f1f]'
          }`}
        >
          {/* Header with All 3 Tabs */}
          <header
            className={`sticky top-0 z-30 border-b backdrop-blur-md ${
              isDark
                ? 'bg-[#131314]/90 border-[#2d2f31]'
                : 'bg-[#f8fafd]/90 border-[#e3e8ef]'
            }`}
          >
            <div className="max-w-[1560px] mx-auto px-4 sm:px-6 py-3 flex flex-wrap items-center justify-between gap-3">
              <div className="flex flex-wrap items-center gap-2.5">
                <div
                  className={`inline-flex flex-wrap items-center rounded-full border p-1 ${
                    isDark ? 'bg-[#1e1f20] border-[#2d2f31]' : 'bg-white border-[#dde3ea]'
                  }`}
                >
                  <button
                    type="button"
                    onClick={() => setActiveView('trends')}
                    className={`px-3.5 py-1.5 rounded-full text-xs sm:text-sm font-semibold transition-colors ${
                      activeView === 'trends'
                        ? isDark
                          ? 'bg-[#a8c7fa] text-[#041e49]'
                          : 'bg-[#0b57d0] text-white'
                        : isDark
                        ? 'text-[#c4c7c5] hover:text-white'
                        : 'text-[#334155] hover:text-black'
                    }`}
                  >
                    Periodic Trends
                  </button>
                  <button
                    type="button"
                    onClick={() => setActiveView('simulator')}
                    className={`px-3.5 py-1.5 rounded-full text-xs sm:text-sm font-semibold transition-colors ${
                      activeView === 'simulator'
                        ? isDark
                          ? 'bg-[#a8c7fa] text-[#041e49]'
                          : 'bg-[#0b57d0] text-white'
                        : isDark
                        ? 'text-[#c4c7c5] hover:text-white'
                        : 'text-[#334155] hover:text-black'
                    }`}
                  >
                    Atomic Simulator
                  </button>
                  <button
                    type="button"
                    onClick={() => setActiveView('theory')}
                    className={`px-3.5 py-1.5 rounded-full text-xs sm:text-sm font-semibold transition-colors ${
                      activeView === 'theory'
                        ? isDark
                          ? 'bg-[#a8c7fa] text-[#041e49]'
                          : 'bg-[#0b57d0] text-white'
                        : isDark
                        ? 'text-[#c4c7c5] hover:text-white'
                        : 'text-[#334155] hover:text-black'
                    }`}
                  >
                    Quantum No. & Config
                  </button>
                </div>
              </div>

              <div className="flex flex-wrap items-center gap-2">
                <form onSubmit={handleSearchSubmit} className="relative">
                  <Search className="w-3.5 h-3.5 absolute left-3.5 top-1/2 -translate-y-1/2 opacity-50" />
                  <input
                    type="text"
                    value={searchQuery}
                    onChange={(e) => setSearchQuery(e.target.value)}
                    placeholder="Search element or Z..."
                    aria-label="Search elements"
                    className={`pl-9 pr-7 py-1.5 text-xs rounded-full border w-44 sm:w-56 focus:outline-none transition-colors ${
                      isDark
                        ? 'bg-[#1e1f20] border-[#2d2f31] text-[#e3e3e3] placeholder-[#8e918f] focus:border-[#a8c7fa]'
                        : 'bg-white border-[#dde3ea] text-[#1f1f1f] placeholder-[#747775] focus:border-[#0b57d0]'
                    }`}
                  />
                  {searchQuery && (
                    <button
                      type="button"
                      onClick={() => setSearchQuery('')}
                      className="absolute right-3 top-1/2 -translate-y-1/2 text-xs opacity-50 hover:opacity-100"
                    >
                      ✕
                    </button>
                  )}
                </form>

                <div
                  className={`inline-flex items-center rounded-full border p-0.5 ${
                    isDark ? 'bg-[#1e1f20] border-[#2d2f31]' : 'bg-white border-[#dde3ea]'
                  }`}
                >
                  <button
                    type="button"
                    onClick={() => handleSelectElement(selectedZ > 1 ? selectedZ - 1 : 118)}
                    className="p-1.5 rounded-full hover:opacity-80 transition-opacity"
                    title="Previous Element"
                  >
                    <ChevronLeft className="w-3.5 h-3.5" />
                  </button>
                  <span className="px-2.5 text-xs font-mono font-medium">
                    {selectedElement.z} · {selectedElement.symbol}
                  </span>
                  <button
                    type="button"
                    onClick={() => handleSelectElement(selectedZ < 118 ? selectedZ + 1 : 1)}
                    className="p-1.5 rounded-full hover:opacity-80 transition-opacity"
                    title="Next Element"
                  >
                    <ChevronRight className="w-3.5 h-3.5" />
                  </button>
                </div>

                <button
                  type="button"
                  onClick={() => setIsDark(!isDark)}
                  className={`p-2 rounded-full border transition-colors ${
                    isDark
                      ? 'bg-[#1e1f20] border-[#2d2f31] text-[#e3e3e3] hover:bg-[#282a2c]'
                      : 'bg-white border-[#dde3ea] text-[#1f1f1f] hover:bg-[#f0f4f9]'
                  }`}
                  title="Toggle Theme"
                  aria-label="Toggle Theme"
                >
                  {isDark ? <Sun className="w-3.5 h-3.5" /> : <Moon className="w-3.5 h-3.5" />}
                </button>
              </div>
            </div>
          </header>

          {/* Main Content Area */}
          <main className="max-w-[1560px] mx-auto px-4 sm:px-6 py-5 space-y-5">
            {activeView === 'trends' ? (
              <PeriodicTrends3DView
                selectedZ={selectedZ}
                onSelectElement={handleSelectElement}
                isDark={isDark}
              />
            ) : activeView === 'theory' ? (
              <QuantumTheoryView
                isDark={isDark}
                onSelectElementInSimulator={(z) => {
                  handleSelectElement(z);
                  setActiveView('simulator');
                }}
              />
            ) : (
              <>
                <section
                  className={`rounded-3xl border px-5 py-3.5 flex flex-col md:flex-row md:items-center justify-between gap-4 ${
                    isDark ? 'bg-[#1e1f20] border-[#2d2f31]' : 'bg-white border-[#e3e8ef]'
                  }`}
                >
                  <div className="flex-1 flex items-center gap-3">
                    <span className="text-xs font-medium opacity-70 whitespace-nowrap">
                      Atomic Number
                    </span>
                    <span className="text-xs font-mono opacity-50">1</span>
                    <input
                      id="z-slider"
                      type="range"
                      min={1}
                      max={118}
                      value={selectedZ}
                      onChange={(e) => handleSelectElement(Number(e.target.value))}
                      className="w-full accent-[#a8c7fa] cursor-pointer h-1.5 rounded-lg"
                    />
                    <span className="text-xs font-mono opacity-50">118</span>
                  </div>

                  <div className="flex flex-wrap items-center gap-1.5">
                    {[
                      { id: 'all', label: 'All' },
                      { id: 's', label: 's-block' },
                      { id: 'p', label: 'p-block' },
                      { id: 'd', label: 'd-block' },
                      { id: 'f', label: 'f-block' },
                      { id: 'anomalous', label: 'Exceptions' }
                    ].map((blk) => {
                      const active = blockFilter === blk.id;
                      return (
                        <button
                          key={blk.id}
                          type="button"
                          onClick={() => setBlockFilter(blk.id)}
                          className={`px-3 py-1 rounded-full text-xs font-medium transition-colors ${
                            active
                              ? isDark
                                ? 'bg-[#a8c7fa] text-[#041e49]'
                                : 'bg-[#0b57d0] text-white'
                              : isDark
                              ? 'bg-[#131314] text-[#c4c7c5] hover:bg-[#282a2c]'
                              : 'bg-[#f0f4f9] text-[#444746] hover:bg-[#e1e6ec]'
                          }`}
                        >
                          {blk.label}
                        </button>
                      );
                    })}
                  </div>
                </section>

                <section
                  className={`rounded-3xl border p-4 overflow-x-auto ${
                    isDark ? 'bg-[#1e1f20] border-[#2d2f31]' : 'bg-white border-[#e3e8ef]'
                  }`}
                >
                  <div className="min-w-[860px]">
                    <div className="grid grid-cols-[24px_repeat(18,minmax(0,1fr))] gap-1 mb-1">
                      <div className="text-[10px] font-mono opacity-40 text-center" />
                      {Array.from({ length: 18 }, (_, i) => (
                        <div key={i + 1} className="text-[10px] font-mono opacity-45 text-center">
                          {i + 1}
                        </div>
                      ))}
                    </div>

                    <div className="space-y-1">
                      {mainGridRows.map((row, pIdx) => (
                        <div
                          key={pIdx + 1}
                          className="grid grid-cols-[24px_repeat(18,minmax(0,1fr))] gap-1 items-center"
                        >
                          <div className="text-[11px] font-mono opacity-45 text-center">
                            {pIdx + 1}
                          </div>

                          {row.map((cell, gIdx) => {
                            if (!cell) {
                              return <div key={`empty-${pIdx}-${gIdx}`} className="h-12 sm:h-[52px]" />;
                            }
                            return renderElementTile(cell);
                          })}
                        </div>
                      ))}
                    </div>

                    <div className="mt-3 pt-2.5 border-t border-[#2d2f31]/40 space-y-1">
                      <div className="grid grid-cols-[24px_repeat(18,minmax(0,1fr))] gap-1 items-center">
                        <div className="text-[10px] font-mono opacity-45 text-center">4f</div>
                        <div className="col-span-3 pr-2 text-right text-[10px] font-mono opacity-55">
                          58–71 (Ce–Lu)
                        </div>
                        {lanthanidesRow.map((el) => renderElementTile(el))}
                        <div className="col-span-1" />
                      </div>

                      <div className="grid grid-cols-[24px_repeat(18,minmax(0,1fr))] gap-1 items-center">
                        <div className="text-[10px] font-mono opacity-45 text-center">5f</div>
                        <div className="col-span-3 pr-2 text-right text-[10px] font-mono opacity-55">
                          90–103 (Th–Lr)
                        </div>
                        {actinidesRow.map((el) => renderElementTile(el))}
                        <div className="col-span-1" />
                      </div>
                    </div>
                  </div>
                </section>

                <section
                  className={`rounded-3xl border p-5 ${
                    isDark ? 'bg-[#1e1f20] border-[#2d2f31]' : 'bg-white border-[#e3e8ef]'
                  }`}
                >
                  <div className="grid grid-cols-1 lg:grid-cols-12 gap-5 items-center">
                    <div className="lg:col-span-7 space-y-4">
                      <div className="flex flex-wrap items-center justify-between gap-3">
                        <div>
                          <div className="flex items-center gap-2.5">
                            <h2 className="text-2xl sm:text-3xl font-bold tracking-tight">
                              {selectedElement.name}
                            </h2>
                            <span
                              className={`px-2.5 py-0.5 text-xs font-mono font-semibold rounded-full ${
                                isDark
                                  ? BLOCK_STYLES[selectedElement.block].pillDark
                                  : BLOCK_STYLES[selectedElement.block].pillLight
                              }`}
                            >
                              {selectedElement.symbol} · Z={selectedElement.z}
                            </span>
                          </div>
                          <p className="text-xs opacity-60 mt-1">
                            {selectedElement.category} · Period {selectedElement.period} ·{' '}
                            {selectedElement.group ? `Group ${selectedElement.group}` : 'f-block'} ·{' '}
                            {selectedElement.block}-block
                          </p>
                        </div>

                        <div className="flex flex-wrap items-center gap-1.5">
                          {selectedElement.shells.map((sh) => (
                            <span
                              key={sh.n}
                              className={`px-2.5 py-1 rounded-xl border text-xs font-mono ${
                                isDark
                                  ? 'bg-[#131314] border-[#2d2f31] text-[#c4c7c5]'
                                  : 'bg-[#f8fafd] border-[#e3e8ef] text-[#444746]'
                              }`}
                            >
                              <strong>{sh.letter}</strong>={sh.count}
                            </span>
                          ))}
                        </div>
                      </div>

                      <div className="grid grid-cols-2 sm:grid-cols-4 gap-2.5 text-xs font-mono">
                        {[
                          { label: 'Atomic Mass', val: `${selectedElement.mass} u` },
                          { label: 'Electrons', val: `${selectedElement.z} e⁻` },
                          {
                            label: 'Unpaired',
                            val: `${selectedElement.totalUnpaired} (${selectedElement.magneticCharacter})`
                          },
                          {
                            label: 'Multiplicity',
                            val: `2S+1 = ${selectedElement.spinMultiplicity}`
                          }
                        ].map((item) => (
                          <div
                            key={item.label}
                            className={`p-2.5 rounded-2xl border ${
                              isDark
                                ? 'bg-[#131314] border-[#2d2f31]'
                                : 'bg-[#f8fafd] border-[#e3e8ef]'
                            }`}
                          >
                            <div className="text-[10px] opacity-55">{item.label}</div>
                            <div className="text-xs font-semibold mt-0.5 truncate">{item.val}</div>
                          </div>
                        ))}
                      </div>

                      {(selectedElement.isAnomalous || selectedElement.isSuperheavy) && (
                        <div
                          className={`px-3.5 py-2.5 rounded-2xl text-xs border flex flex-wrap items-center gap-2 ${
                            isDark
                              ? 'bg-[#131314] border-[#2d2f31] text-[#c4c7c5]'
                              : 'bg-[#f0f4f9] border-[#dde3ea] text-[#444746]'
                          }`}
                        >
                          <span className="font-semibold text-amber-400">
                            {selectedElement.statusLabel}:
                          </span>
                          <span className="opacity-85">{selectedElement.statusNote}</span>
                        </div>
                      )}
                    </div>

                    <div className="lg:col-span-5 grid grid-cols-1 gap-2.5">
                      <div
                        className={`p-3.5 rounded-2xl border ${
                          isDark ? 'bg-[#131314] border-[#2d2f31]' : 'bg-[#f8fafd] border-[#e3e8ef]'
                        }`}
                      >
                        <div className="flex items-center justify-between mb-1">
                          <span className="text-[11px] opacity-55">Noble-Gas Configuration</span>
                          <button
                            type="button"
                            onClick={() => handleCopy(selectedElement.nobleConfigAufbau, 'noble')}
                            className="flex items-center gap-1 text-[11px] opacity-65 hover:opacity-100 transition-opacity"
                          >
                            {copiedKey === 'noble' ? (
                              <>
                                <Check className="w-3 h-3" />
                                <span>Copied</span>
                              </>
                            ) : (
                              <>
                                <Copy className="w-3 h-3" />
                                <span>Copy</span>
                              </>
                            )}
                          </button>
                        </div>
                        <div
                          className={`text-base font-mono font-semibold tracking-wide break-words ${
                            isDark ? 'text-[#a8c7fa]' : 'text-[#0b57d0]'
                          }`}
                        >
                          {selectedElement.nobleConfigAufbau}
                        </div>
                      </div>

                      <div
                        className={`p-3.5 rounded-2xl border ${
                          isDark ? 'bg-[#131314] border-[#2d2f31]' : 'bg-[#f8fafd] border-[#e3e8ef]'
                        }`}
                      >
                        <div className="flex items-center justify-between mb-1">
                          <span className="text-[11px] opacity-55">Full Shell Configuration</span>
                          <button
                            type="button"
                            onClick={() => handleCopy(selectedElement.fullConfigShell, 'full')}
                            className="flex items-center gap-1 text-[11px] opacity-65 hover:opacity-100 transition-opacity"
                          >
                            {copiedKey === 'full' ? (
                              <>
                                <Check className="w-3 h-3" />
                                <span>Copied</span>
                              </>
                            ) : (
                              <>
                                <Copy className="w-3 h-3" />
                                <span>Copy</span>
                              </>
                            )}
                          </button>
                        </div>
                        <div className="text-xs sm:text-sm font-mono font-medium leading-relaxed break-words opacity-90">
                          {selectedElement.fullConfigShell}
                        </div>
                      </div>
                    </div>
                  </div>
                </section>

                <div className="grid grid-cols-1 lg:grid-cols-12 gap-5 items-stretch">
                  <div
                    className={`lg:col-span-6 rounded-3xl border p-5 flex flex-col ${
                      isDark ? 'bg-[#1e1f20] border-[#2d2f31]' : 'bg-white border-[#e3e8ef]'
                    }`}
                  >
                    <Interactive3DAtomSimulator
                      element={selectedElement}
                      activeSubshellsMap={activeSubshellsMap}
                      activeShells={activeShells}
                      isDark={isDark}
                    />
                  </div>

                  <div
                    className={`lg:col-span-6 rounded-3xl border p-5 flex flex-col space-y-4 ${
                      isDark ? 'bg-[#1e1f20] border-[#2d2f31]' : 'bg-white border-[#e3e8ef]'
                    }`}
                  >
                    <div className="flex flex-wrap items-center justify-between gap-2">
                      <div className="flex items-center gap-2">
                        <h3 className="text-sm font-semibold">
                          Orbital Box Diagram · {selectedElement.symbol}
                        </h3>
                        <button
                          type="button"
                          onClick={() =>
                            setOrbitalFilterMode(orbitalFilterMode === 'all' ? 'valence' : 'all')
                          }
                          className={`px-2.5 py-1 rounded-full text-[11px] font-mono border transition-colors ${
                            orbitalFilterMode === 'valence'
                              ? isDark
                                ? 'bg-[#a8c7fa] text-[#041e49] border-transparent'
                                : 'bg-[#0b57d0] text-white border-transparent'
                              : isDark
                              ? 'bg-[#131314] border-[#2d2f31] text-[#c4c7c5]'
                              : 'bg-[#f0f4f9] border-[#dde3ea] text-[#444746]'
                          }`}
                        >
                          {orbitalFilterMode === 'all' ? 'All Subshells' : 'Valence Only'}
                        </button>
                      </div>

                      <div className="flex items-center gap-1.5">
                        <button
                          type="button"
                          onClick={() => {
                            const nextState = !animEnabled;
                            setAnimEnabled(nextState);
                            if (nextState) {
                              setAnimElectronCount(1);
                              setAnimPlaying(true);
                            } else {
                              setAnimPlaying(false);
                              setAnimElectronCount(selectedElement.z);
                            }
                          }}
                          className={`px-3 py-1 rounded-full text-xs font-medium flex items-center gap-1.5 transition-colors ${
                            animEnabled
                              ? isDark
                                ? 'bg-[#a8c7fa] text-[#041e49]'
                                : 'bg-[#0b57d0] text-white'
                              : isDark
                              ? 'bg-[#131314] border border-[#2d2f31] text-[#e3e3e3] hover:bg-[#282a2c]'
                              : 'bg-[#f0f4f9] text-[#1f1f1f] hover:bg-[#e1e6ec]'
                          }`}
                        >
                          <Play className="w-3 h-3" />
                          <span>{animEnabled ? 'Stop Filling' : 'Simulate Filling'}</span>
                        </button>
                      </div>
                    </div>

                    {animEnabled && (
                      <div
                        className={`px-3.5 py-2 rounded-2xl border flex flex-wrap items-center justify-between gap-2 text-xs font-mono ${
                          isDark ? 'bg-[#131314] border-[#2d2f31]' : 'bg-[#f8fafd] border-[#e3e8ef]'
                        }`}
                      >
                        <div className="flex items-center gap-1">
                          <button
                            type="button"
                            onClick={() => {
                              setAnimPlaying(false);
                              setAnimElectronCount(1);
                            }}
                            className="p-1 rounded-full hover:opacity-75"
                            title="Reset"
                          >
                            <RotateCcw className="w-3.5 h-3.5" />
                          </button>
                          <button
                            type="button"
                            onClick={() => {
                              setAnimPlaying(false);
                              setAnimElectronCount((c) => Math.max(1, c - 1));
                            }}
                            className="p-1 rounded-full hover:opacity-75"
                            title="Previous electron"
                          >
                            <SkipBack className="w-3.5 h-3.5" />
                          </button>
                          <button
                            type="button"
                            onClick={() => {
                              if (animElectronCount >= selectedElement.z) {
                                setAnimElectronCount(1);
                                setAnimPlaying(true);
                              } else {
                                setAnimPlaying(!animPlaying);
                              }
                            }}
                            className="px-2.5 py-0.5 rounded-full bg-emerald-500/20 text-emerald-400 text-xs font-medium flex items-center gap-1"
                          >
                            {animPlaying ? <Pause className="w-3 h-3" /> : <Play className="w-3 h-3" />}
                            <span>{animPlaying ? 'Pause' : 'Play'}</span>
                          </button>
                          <button
                            type="button"
                            onClick={() => {
                              setAnimPlaying(false);
                              setAnimElectronCount((c) => Math.min(selectedElement.z, c + 1));
                            }}
                            className="p-1 rounded-full hover:opacity-75"
                            title="Next electron"
                          >
                            <SkipForward className="w-3.5 h-3.5" />
                          </button>
                        </div>

                        <div className="flex items-center gap-2">
                          <span>
                            {animElectronCount}/{selectedElement.z} e⁻
                          </span>
                          {currentAnimStep && (
                            <span className="opacity-70">
                              · {currentAnimStep.subshell} (m_l={currentAnimStep.ml}, {currentAnimStep.ms})
                            </span>
                          )}
                          <div className="flex items-center gap-1">
                            {[
                              { label: '0.5x', ms: 600 },
                              { label: '1x', ms: 300 },
                              { label: '2x', ms: 150 }
                            ].map((sp) => (
                              <button
                                key={sp.label}
                                type="button"
                                onClick={() => setAnimSpeedMs(sp.ms)}
                                className={`px-2 py-0.5 rounded-full text-[10px] ${
                                  animSpeedMs === sp.ms
                                    ? isDark
                                      ? 'bg-[#a8c7fa] text-[#041e49]'
                                      : 'bg-[#0b57d0] text-white'
                                    : 'opacity-60'
                                }`}
                              >
                                {sp.label}
                              </button>
                            ))}
                          </div>
                        </div>
                      </div>
                    )}

                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 max-h-[420px] overflow-y-auto pr-1 flex-1 content-start">
                      {activeOrbitalDiagrams.map((diag) => (
                        <SubshellOrbitalCard
                          key={diag.subshell}
                          diagram={diag}
                          isHighlighted={
                            animEnabled &&
                            currentAnimStep &&
                            currentAnimStep.subshell === diag.subshell
                          }
                          isDark={isDark}
                        />
                      ))}
                    </div>
                  </div>
                </div>
              </>
            )}
          </main>
        </div>
      );
    }

    const rootElement = document.getElementById('root');
    const root = ReactDOM.createRoot(rootElement);
    root.render(<App />);
  </script>
</body>
</html>
