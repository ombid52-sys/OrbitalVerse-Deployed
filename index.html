    function evalRealSphericalHarmonic(l, mIndex, nx, ny, nz) {
      if (l === 0) return 0.5;
      if (l === 1) {
        if (mIndex === 0) return 0.85 * nx;
        if (mIndex === 1) return 0.85 * nz;
        return 0.85 * ny;
      }
      if (l === 2) {
        if (mIndex === 0) return 1.75 * nx * ny;
        if (mIndex === 1) return 1.75 * ny * nz;
        if (mIndex === 2) return 0.55 * (3 * nz * nz - 1);
        if (mIndex === 3) return 1.75 * nx * nz;
        return 0.88 * (nx * nx - ny * ny);
      }
      if (l === 3) {
        if (mIndex === 0) return 0.95 * ny * (3 * nx * nx - ny * ny);
        if (mIndex === 1) return 3.1 * nx * ny * nz;
        if (mIndex === 2) return 0.85 * ny * (5 * nz * nz - 1);
        if (mIndex === 3) return 0.55 * nz * (5 * nz * nz - 3);
        if (mIndex === 4) return 0.85 * nx * (5 * nz * nz - 1);
        if (mIndex === 5) return 1.55 * nz * (nx * nx - ny * ny);
        return 0.95 * nx * (nx * nx - 3 * ny * ny);
      }
      return 0.5;
    }

    function buildOrbitalSurfaceMesh(n, l, mIndex, color) {
      const baseR = 26 + n * 22;
      const nTheta = l === 0 ? 18 : 26;
      const nPhi = l === 0 ? 28 : 40;
      const vertices = [];

      for (let i = 0; i <= nTheta; i++) {
        const theta = (i / nTheta) * Math.PI;
        const sinT = Math.sin(theta);
        const cosT = Math.cos(theta);
        const row = [];

        for (let j = 0; j <= nPhi; j++) {
          const phi = (j / nPhi) * Math.PI * 2;
          const nx = sinT * Math.cos(phi);
          const ny = sinT * Math.sin(phi);
          const nz = cosT;

          const yVal = evalRealSphericalHarmonic(l, mIndex, nx, ny, nz);
          const amp = Math.abs(yVal);
          const r = l === 0 ? baseR * 0.72 : baseR * amp * 1.05;

          row.push({
            x: nx * r,
            y: ny * r,
            z: nz * r,
            nx,
            ny,
            nz,
            amp,
            phaseSign: yVal >= 0 ? 1 : -1
          });
        }
        vertices.push(row);
      }

      const faces = [];
      for (let i = 0; i < nTheta; i++) {
        for (let j = 0; j < nPhi; j++) {
          const v00 = vertices[i][j];
          const v10 = vertices[i + 1][j];
          const v11 = vertices[i + 1][j + 1];
          const v01 = vertices[i][j + 1];

          const maxAmp = Math.max(v00.amp, v10.amp, v11.amp, v01.amp);
          if (maxAmp < 0.06) continue;

          faces.push({
            verts: [v00, v10, v11, v01],
            cx: (v00.x + v10.x + v11.x + v01.x) * 0.25,
            cy: (v00.y + v10.y + v11.y + v01.y) * 0.25,
            cz: (v00.z + v10.z + v11.z + v01.z) * 0.25,
            nx: (v00.nx + v10.nx + v11.nx + v01.nx) * 0.25,
            ny: (v00.ny + v10.ny + v11.ny + v01.ny) * 0.25,
            nz: (v00.nz + v10.nz + v11.nz + v01.nz) * 0.25,
            phaseSign: v00.phaseSign,
            color
          });
        }
      }

      return faces;
    }

    function computeAufbauSubshells(electronCount) {
      let remaining = electronCount;
      const subshells = {};
      for (const sub of SUBSHELL_ORDER) {
        if (remaining <= 0) break;
        const type = sub[1];
        const cap = SUBSHELL_CAPACITY[type];
        const fill = Math.min(remaining, cap);
        if (fill > 0) {
          subshells[sub] = fill;
          remaining -= fill;
        }
      }
      return subshells;
    }

    function computeGroundStateSubshells(z) {
      const anomaly = ANOMALOUS_CONFIGS[z];
      if (!anomaly) return computeAufbauSubshells(z);

      let coreGas = null;
      for (let i = NOBLE_GASES.length - 1; i >= 0; i--) {
        if (NOBLE_GASES[i].z < z) {
          coreGas = NOBLE_GASES[i];
          break;
        }
      }
      const subshells = {};
      if (coreGas) {
        for (const sub of coreGas.subshells) {
          subshells[sub] = SUBSHELL_CAPACITY[sub[1]];
        }
      }
      for (const [sub, count] of Object.entries(anomaly.valence)) {
        if (count > 0) subshells[sub] = count;
      }
      return subshells;
    }

    function formatConfigString(subshellsMap, orderType = 'aufbau') {
      const orderList = orderType === 'shell' ? SHELL_ORDER : SUBSHELL_ORDER;
      return orderList
        .filter((sub) => subshellsMap[sub] > 0)
        .map((sub) => `${sub}${toSuperscript(subshellsMap[sub])}`)
        .join(' ');
    }

    function formatNobleGasString(z, subshellsMap, orderType = 'aufbau') {
      if (z <= 2) return formatConfigString(subshellsMap, orderType);
      let coreGas = null;
      for (let i = NOBLE_GASES.length - 1; i >= 0; i--) {
        if (NOBLE_GASES[i].z < z) {
          coreGas = NOBLE_GASES[i];
          break;
        }
      }
      if (!coreGas) return formatConfigString(subshellsMap, orderType);

      const coreSet = new Set(coreGas.subshells);
      const orderList = orderType === 'shell' ? SHELL_ORDER : SUBSHELL_ORDER;
      const valenceParts = orderList
        .filter((sub) => !coreSet.has(sub) && subshellsMap[sub] > 0)
        .map((sub) => `${sub}${toSuperscript(subshellsMap[sub])}`);

      return `[${coreGas.symbol}] ${valenceParts.join(' ')}`.trim();
    }

    function computeShellDistribution(subshellsMap) {
      const shells = [0, 0, 0, 0, 0, 0, 0];
      for (const [sub, count] of Object.entries(subshellsMap)) {
        const n = parseInt(sub[0], 10);
        if (n >= 1 && n <= 7) shells[n - 1] += count;
      }
      let lastNonZero = shells.length - 1;
      while (lastNonZero > 0 && shells[lastNonZero] === 0) {
        lastNonZero--;
      }
      return shells.slice(0, lastNonZero + 1).map((count, idx) => ({
        n: idx + 1,
        letter: SHELL_LETTERS[idx],
        count,
        capacity: 2 * Math.pow(idx + 1, 2)
      }));
    }

    function generateOrbitalBoxesForSubshell(subshellLabel, electronCount) {
      const n = parseInt(subshellLabel[0], 10);
      const type = subshellLabel[1];
      const l = L_QUANTUM_NUMBER[type];
      const numBoxes = SUBSHELL_BOXES[type];
      const capacity = SUBSHELL_CAPACITY[type];
      const validCount = Math.max(0, Math.min(electronCount, capacity));

      const boxes = [];
      for (let i = 0; i < numBoxes; i++) {
        const ml = -l + i;
        boxes.push({
          index: i,
          ml,
          mlLabel: ml > 0 ? `+${ml}` : `${ml}`,
          up: false,
          down: false,
          electrons: 0
        });
      }

      let remaining = validCount;
      for (let i = 0; i < numBoxes && remaining > 0; i++) {
        boxes[i].up = true;
        boxes[i].electrons += 1;
        remaining--;
      }
      for (let i = 0; i < numBoxes && remaining > 0; i++) {
        boxes[i].down = true;
        boxes[i].electrons += 1;
        remaining--;
      }

      const unpaired = boxes.reduce((acc, b) => acc + (b.up && !b.down ? 1 : 0), 0);
      const paired = boxes.reduce((acc, b) => acc + (b.up && b.down ? 1 : 0), 0);

      return {
        subshell: subshellLabel,
        n,
        l,
        type,
        capacity,
        electronCount: validCount,
        boxes,
        unpaired,
        paired
      };
    }

    function buildElectronSequence(subshellsMap) {
      const sequence = [];
      for (const sub of SUBSHELL_ORDER) {
        const count = subshellsMap[sub] || 0;
        if (count <= 0) continue;
        const n = parseInt(sub[0], 10);
        const type = sub[1];
        const l = L_QUANTUM_NUMBER[type];
        const numBoxes = SUBSHELL_BOXES[type];

        for (let eIdx = 0; eIdx < count; eIdx++) {
          const isSpinUp = eIdx < numBoxes;
          const boxIndex = isSpinUp ? eIdx : eIdx - numBoxes;
          const ml = -l + boxIndex;
          const ms = isSpinUp ? '+1/2' : '-1/2';
          sequence.push({
            stepNumber: sequence.length + 1,
            subshell: sub,
            n,
            l,
            ml,
            ms,
            boxIndex,
            spin: isSpinUp ? 'up' : 'down'
          });
        }
      }
      return sequence;
    }

      const shells = computeShellDistribution(groundSubshells);
      const orbitalDiagrams = SUBSHELL_ORDER
        .filter((sub) => groundSubshells[sub] > 0)
        .map((sub) => generateOrbitalBoxesForSubshell(sub, groundSubshells[sub]));

      const totalUnpaired = orbitalDiagrams.reduce((acc, d) => acc + d.unpaired, 0);
      const spinMultiplicity = totalUnpaired + 1;

      return {
        z,
        symbol,
        name,
        period,
        group,
        block,
        category,
        mass,
        groundSubshells,
        isAnomalous,
        isSuperheavy,

    function evaluateBarColor(normValue, blockType, paletteKey = 'thermalAmber') {
      const palette = BAR_COLOR_PALETTES[paletteKey] || BAR_COLOR_PALETTES.thermalAmber;
      const t = Math.max(0, Math.min(1, normValue));

      if (palette.isBlockBased) {
        const blk = BLOCK_BAR_COLORS[blockType] || BLOCK_BAR_COLORS.d;
        return new THREE.Color(blk.low).lerp(new THREE.Color(blk.high), 0.35 + 0.65 * t);
      }

      const stops = palette.stops;
      for (let i = 0; i < stops.length - 1; i++) {
        const [t0, hex0] = stops[i];
        const [t1, hex1] = stops[i + 1];
        if (t >= t0 && t <= t1) {
          const localT = (t - t0) / Math.max(0.0001, t1 - t0);
          return new THREE.Color(hex0).lerp(new THREE.Color(hex1), localT);
        }
      }
      return new THREE.Color(stops[stops.length - 1][1]);
    }

    function createHorizontalTopTileTexture(el, valStr, accentHex) {
      const canvas = document.createElement('canvas');
      canvas.width = 256;
      canvas.height = 256;
      const ctx = canvas.getContext('2d');

      ctx.fillStyle = '#0f141c';
      ctx.fillRect(0, 0, 256, 256);

      ctx.fillStyle = accentHex;
      ctx.fillRect(0, 0, 256, 18);

      ctx.strokeStyle = 'rgba(148, 163, 184, 0.45)';
      ctx.lineWidth = 6;
      ctx.strokeRect(3, 3, 250, 250);

      ctx.fillStyle = '#94a3b8';
      ctx.font = '700 30px "JetBrains Mono", monospace';
      ctx.textAlign = 'left';
      ctx.fillText(String(el.z), 20, 56);

      ctx.fillStyle = '#38bdf8';
      ctx.font = '700 26px "JetBrains Mono", monospace';
      ctx.textAlign = 'right';
      ctx.fillText(valStr, 236, 54);

      ctx.fillStyle = '#ffffff';
      ctx.font = '800 92px "Plus Jakarta Sans", sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(el.symbol, 128, 154);

      ctx.fillStyle = '#cbd5e1';
      ctx.font = '700 28px "Plus Jakarta Sans", sans-serif';
      ctx.textAlign = 'center';
      const clippedName = el.name.length > 11 ? el.name.slice(0, 10) + '.' : el.name;
      ctx.fillText(clippedName, 128, 222);

      const tex = new THREE.CanvasTexture(canvas);
      tex.anisotropy = 4;
      tex.minFilter = THREE.LinearFilter;
      tex.magFilter = THREE.LinearFilter;
      tex.needsUpdate = true;
      return tex;
    }

    function createBaseSocketTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 64;
      canvas.height = 64;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#0d1117';
      ctx.fillRect(0, 0, 64, 64);
      ctx.strokeStyle = 'rgba(148, 163, 184, 0.18)';
      ctx.lineWidth = 2;
      ctx.strokeRect(2, 2, 60, 60);
      const tex = new THREE.CanvasTexture(canvas);
      tex.needsUpdate = true;
      return tex;
    }

        dirLight2.position.set(-18, 20, -14);
        scene.add(dirLight2);

        // Base Platform
        const platformGeo = new THREE.BoxGeometry(25.2, 0.26, 15.8);
        const platformMat = new THREE.MeshStandardMaterial({
          color: 0x11161f,
          roughness: 0.8,
          metalness: 0.2
        });
        const platformMesh = new THREE.Mesh(platformGeo, platformMat);
        platformMesh.position.set(0, -0.15, 0.85);
        scene.add(platformMesh);

        const gridHelper = new THREE.GridHelper(32, 32, 0x1e293b, 0x141b26);
        gridHelper.position.set(0, -0.01, 0.85);
        scene.add(gridHelper);

        const barsByZ = {};
        const pickableMeshes = [];
        const spacing = 1.24;

        const barGeo = new THREE.BoxGeometry(1.04, 1.0, 1.04);
        barGeo.translate(0, 0.5, 0);
        const barEdgesGeo = new THREE.EdgesGeometry(barGeo);

        const topTileGeo = new THREE.PlaneGeometry(1.04, 1.04);
        topTileGeo.rotateX(-Math.PI / 2);

        const socketGeo = new THREE.PlaneGeometry(1.08, 1.08);
        socketGeo.rotateX(-Math.PI / 2);
        const sharedSocketTex = createBaseSocketTexture();
        const sharedSocketMat = new THREE.MeshBasicMaterial({ map: sharedSocketTex });

        ELEMENTS_DATABASE.forEach((el) => {
          let colIndex = (el.group || 1) - 1;
          let rowIndex = el.period - 1;

          if (el.z >= 58 && el.z <= 71) {
            colIndex = el.z - 58 + 3;
            rowIndex = 7.7;
          } else if (el.z >= 90 && el.z <= 103) {
            colIndex = el.z - 90 + 3;
            rowIndex = 8.85;
          }

          const worldX = (colIndex - 8.5) * spacing;
          const worldZ = (rowIndex - 3.6) * spacing;

          const socketMesh = new THREE.Mesh(socketGeo, sharedSocketMat);
          socketMesh.position.set(worldX, 0.01, worldZ);

          const barMat = new THREE.MeshStandardMaterial({

          pickableMeshes.push(topTileMesh);

          const ringGeo = new THREE.RingGeometry(0.56, 0.66, 4);
          ringGeo.rotateY(Math.PI / 4);
          ringGeo.rotateX(-Math.PI / 2);
          const ringMat = new THREE.MeshBasicMaterial({
            color: 0xfbbf24,
            side: THREE.DoubleSide,
            transparent: true,
            opacity: 0.0
          });
          const ringMesh = new THREE.Mesh(ringGeo, ringMat);
          ringMesh.position.set(worldX, 0.21, worldZ);
          scene.add(ringMesh);

          barsByZ[el.z] = {
            el,
            worldX,
            worldZ,
            barMesh,
            barMat,
            edgeMat,
            topTileMesh,
            topTileMat,
            ringMesh,
            ringMat,
            currentHeight: 0.15,
            targetHeight: 1.0,
            currentColor: new THREE.Color(0x1d4ed8),
            targetColor: new THREE.Color(0x1d4ed8),
            targetOpacity: 0.95
          };
        });

        sceneObjectsRef.current.barsByZ = barsByZ;

        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        let isDragging = false;
        let isPanning = false;
        let downX = 0;
        let downY = 0;
        let lastX = 0;
        let lastY = 0;

        const domEl = renderer.domElement;

        const handlePointerDown = (e) => {
          isDragging = true;
          isPanning = e.button === 2 || e.shiftKey;
          downX = e.clientX;
          downY = e.clientY;
          lastX = e.clientX;
          lastY = e.clientY;
        };

        const handlePointerMove = (e) => {
          const rect = domEl.getBoundingClientRect();
          mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
          mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;

          if (isDragging) {
            const dx = e.clientX - lastX;
            const dy = e.clientY - lastY;
            lastX = e.clientX;
            lastY = e.clientY;

            const cs = sceneObjectsRef.current.cameraState;
            if (isPanning) {
              cs.goalTargetX -= dx * 0.025;
              cs.goalTargetZ -= dy * 0.025;
            } else {
              cs.goalTheta -= dx * 0.0075;
              cs.goalPhi = Math.max(0.10, Math.min(1.45, cs.goalPhi - dy * 0.0075));
            }
            return;
          }

          raycaster.setFromCamera(mouse, camera);
          const hits = raycaster.intersectObjects(pickableMeshes, false);
          if (hits.length > 0) {
            const hitZ = hits[0].object.userData.z;
            setHoveredZ(hitZ);
            domEl.style.cursor = 'pointer';
          } else {
            setHoveredZ(null);
            domEl.style.cursor = 'grab';
          }
        };

        const handlePointerUp = (e) => {
          const moveDist = Math.hypot(e.clientX - downX, e.clientY - downY);
          isDragging = false;
          if (moveDist < 5) {
            const rect = domEl.getBoundingClientRect();
            mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
            mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            const hits = raycaster.intersectObjects(pickableMeshes, false);
            if (hits.length > 0 && hits[0].object.userData.z) {
              onSelectElement(hits[0].object.userData.z);
            }
          }
        };

        const handleWheel = (e) => {
          e.preventDefault();
          const cs = sceneObjectsRef.current.cameraState;
          const factor = e.deltaY > 0 ? 1.08 : 0.92;
          cs.goalDistance = Math.max(11, Math.min(44, cs.goalDistance * factor));
        };

        const handleContextMenu = (e) => e.preventDefault();

        domEl.addEventListener('pointerdown', handlePointerDown);
        window.addEventListener('pointermove', handlePointerMove);
        window.addEventListener('pointerup', handlePointerUp);
        domEl.addEventListener('wheel', handleWheel, { passive: false });
        domEl.addEventListener('contextmenu', handleContextMenu);

        const handleResize = () => {
          if (!container) return;
          camera.aspect = container.clientWidth / Math.max(1, container.clientHeight);
          camera.updateProjectionMatrix();
          renderer.setSize(container.clientWidth, container.clientHeight);
        };
        window.addEventListener('resize', handleResize);

        let animId;
        const animate = () => {
          const cs = sceneObjectsRef.current.cameraState;
          cs.theta += (cs.goalTheta - cs.theta) * 0.12;
          cs.phi += (cs.goalPhi - cs.phi) * 0.12;
          cs.distance += (cs.goalDistance - cs.distance) * 0.12;
          cs.targetX += (cs.goalTargetX - cs.targetX) * 0.12;
          cs.targetY += (cs.goalTargetY - cs.targetY) * 0.12;
          cs.targetZ += (cs.goalTargetZ - cs.targetZ) * 0.12;

          camera.position.x = cs.targetX + cs.distance * Math.sin(cs.phi) * Math.sin(cs.theta);
          camera.position.y = cs.targetY + cs.distance * Math.cos(cs.phi);
          camera.position.z = cs.targetZ + cs.distance * Math.sin(cs.phi) * Math.cos(cs.theta);
          camera.lookAt(cs.targetX, cs.targetY, cs.targetZ);

          const allBars = Object.values(sceneObjectsRef.current.barsByZ);
          for (let i = 0; i < allBars.length; i++) {
            const b = allBars[i];
            b.currentHeight += (b.targetHeight - b.currentHeight) * 0.14;
            const h = Math.max(0.08, b.currentHeight);
            b.barMesh.scale.y = h;

            const topY = 0.02 + h;
            b.topTileMesh.position.y = topY + 0.006;
            b.ringMesh.position.y = topY + 0.012;

            b.currentColor.lerp(b.targetColor, 0.15);
            b.barMat.color.copy(b.currentColor);
            b.barMat.emissive.copy(b.currentColor).multiplyScalar(0.18);
            b.barMat.opacity += (b.targetOpacity - b.barMat.opacity) * 0.15;

            b.topTileMat.opacity = b.barMat.opacity > 0.3 ? 1.0 : 0.18;
            b.edgeMat.opacity = b.barMat.opacity * 0.32;
          }

          renderer.render(scene, camera);
          animId = requestAnimationFrame(animate);
        };
        animId = requestAnimationFrame(animate);

        return () => {
          cancelAnimationFrame(animId);
          domEl.removeEventListener('pointerdown', handlePointerDown);
          window.removeEventListener('pointermove', handlePointerMove);
          window.removeEventListener('pointerup', handlePointerUp);
          domEl.removeEventListener('wheel', handleWheel);
          domEl.removeEventListener('contextmenu', handleContextMenu);

          renderer.dispose();

    function Interactive3DAtomSimulator({
      element,
      activeSubshellsMap,
      activeShells,
      isDark
    }) {
      const canvasRef = useRef(null);

      const occupiedSubshellsList = useMemo(
        () => SUBSHELL_ORDER.filter((s) => activeSubshellsMap[s] > 0),
        [activeSubshellsMap]
      );

      const [selectedSubshell, setSelectedSubshell] = useState('valence');
      const [selectedOrbitalIdx, setSelectedOrbitalIdx] = useState('all');
      const [shellPlane, setShellPlane] = useState('XY');
      const [simPlaying, setSimPlaying] = useState(true);

      useEffect(() => {
        setSelectedOrbitalIdx('all');
      }, [element.z, selectedSubshell]);

      const cameraRef = useRef({
        rotX: 0.48,
        rotY: -0.62,
        zoom: 1.0,
        isDragging: false,
        lastX: 0,
        lastY: 0
      });

      const targetSubshells = useMemo(() => {
        if (
          selectedSubshell !== 'all' &&
          selectedSubshell !== 'valence' &&
          activeSubshellsMap[selectedSubshell]
        ) {
          return [selectedSubshell];
        }
        if (selectedSubshell === 'all') {
          return occupiedSubshellsList;
        }
        return occupiedSubshellsList.slice(-1);
      }, [selectedSubshell, activeSubshellsMap, occupiedSubshellsList]);

      const orbitalSurfaceFaces = useMemo(() => {
        const allFaces = [];
        for (const sub of targetSubshells) {
          const n = parseInt(sub[0], 10);
          const type = sub[1];
          const l = L_QUANTUM_NUMBER[type];
          const numBoxes = SUBSHELL_BOXES[type];
          const count = activeSubshellsMap[sub] || 0;
          const color = BLOCK_STYLES[type].accent;

          for (let mIdx = 0; mIdx < numBoxes; mIdx++) {
            if (selectedOrbitalIdx !== 'all') {
              if (mIdx !== Number(selectedOrbitalIdx)) continue;
            } else if (mIdx >= count) {
              continue;
            }

            const meshFaces = buildOrbitalSurfaceMesh(n, l, mIdx, color);
            for (let k = 0; k < meshFaces.length; k++) {
              allFaces.push(meshFaces[k]);
            }
          }
        }
        return allFaces;
      }, [targetSubshells, activeSubshellsMap, selectedOrbitalIdx]);

      const electrons3D = useMemo(() => {
        const list = [];
        for (const sub of SUBSHELL_ORDER) {
          const count = activeSubshellsMap[sub] || 0;
          if (count <= 0) continue;
          const n = parseInt(sub[0], 10);
          const type = sub[1];
          const l = L_QUANTUM_NUMBER[type];
          const numBoxes = SUBSHELL_BOXES[type];

          for (let i = 0; i < count; i++) {
            const isUp = i < numBoxes;
            const mIndex = isUp ? i : i - numBoxes;
            const id = list.length;

            const phaseA = (id * 2.3999632 + mIndex * 1.1) % (2 * Math.PI);
            const phaseB = (id * 1.6180339 + n * 0.7) % (2 * Math.PI);

            list.push({
              id,
              subshell: sub,
              n,
              l,
              type,
              mIndex,
              spin: isUp ? '+1/2' : '-1/2',
              phaseA,
              phaseB,
              color: TRACE_PALETTE[id % TRACE_PALETTE.length],
              blockColor: BLOCK_STYLES[type].accent
            });
          }
        }
        return list;
      }, [activeSubshellsMap]);

      const timeRef = useRef(0);
      const tracesRef = useRef({});

      useEffect(() => {
        tracesRef.current = {};
      }, [element.z, selectedSubshell, selectedOrbitalIdx]);

      const computeElectronPosition3D = useCallback((e, t) => {
        const baseR = 26 + e.n * 22;
        const w1 = (0.85 + (e.id % 5) * 0.12) * (e.spin === '+1/2' ? 1 : -1);
        const w2 = 1.25 + (e.mIndex + 1) * 0.2;
        const u = t * w1 + e.phaseA;
        const v = t * w2 + e.phaseB;

        if (e.l === 0) {
          const r = baseR * 0.72;
          return {
            x: Math.sin(u) * Math.cos(v) * r,
            y: Math.sin(u) * Math.sin(v) * r,
            z: Math.cos(u) * r
          };
        }

        const nx = Math.sin(u) * Math.cos(v * 0.75);
        const ny = Math.sin(u) * Math.sin(v * 0.75);
        const nz = Math.cos(u);
        const yHarmonic = evalRealSphericalHarmonic(e.l, e.mIndex, nx, ny, nz);
        const r = baseR * Math.max(0.18, Math.abs(yHarmonic) * 1.02);

        return {
          x: nx * r,
          y: ny * r,
          z: nz * r
        };
      }, []);

      useEffect(() => {
        let animFrameId;
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');

        const project3D = (x, y, z, width, height, cam, maxShellN) => {
          const qx = x;
          const qy = -z;
          const qz = y;

          const cosY = Math.cos(cam.rotY);
          const sinY = Math.sin(cam.rotY);
          const x1 = qx * cosY - qz * sinY;
          const z1 = qx * sinY + qz * cosY;

          const cosX = Math.cos(cam.rotX);
          const sinX = Math.sin(cam.rotX);
          const y2 = qy * cosX - z1 * sinX;
          const z2 = qy * sinX + z1 * cosX;

          const autoFit = Math.max(0.68, 1.15 - maxShellN * 0.065);
          const fov = 440 * cam.zoom * autoFit;
          const viewerDist = 420;
          const scale = fov / Math.max(80, viewerDist + z2);

          return {
            sx: width / 2 + x1 * scale,
            sy: height / 2 + y2 * scale,
            depth: z2,
            scale
          };
        };

        const renderFrame = () => {
          const rect = canvas.getBoundingClientRect();
          const dpr = window.devicePixelRatio || 1;
          if (
            canvas.width !== Math.floor(rect.width * dpr) ||
            canvas.height !== Math.floor(rect.height * dpr)
          ) {
            canvas.width = Math.floor(rect.width * dpr);
            canvas.height = Math.floor(rect.height * dpr);
          }

          ctx.save();
          ctx.scale(dpr, dpr);
          const width = rect.width;
          const height = rect.height;
          const cam = cameraRef.current;
          const maxShellN = activeShells.length || 1;

          ctx.fillStyle = isDark ? '#101214' : '#f4f7fb';
          ctx.fillRect(0, 0, width, height);

          if (simPlaying) {
            timeRef.current += 0.018;
          }
          const t = timeRef.current;

          const axisLen = 40 + maxShellN * 24;
          const origin = project3D(0, 0, 0, width, height, cam, maxShellN);
          const axesDef = [
            { label: 'X', x: axisLen, y: 0, z: 0, color: '#ef4444' },
            { label: 'Y', x: 0, y: axisLen, z: 0, color: '#10b981' },
            { label: 'Z', x: 0, y: 0, z: axisLen, color: '#3b82f6' }
          ];
          axesDef.forEach((ax) => {
            const pEnd = project3D(ax.x, ax.y, ax.z, width, height, cam, maxShellN);
            ctx.beginPath();
            ctx.moveTo(origin.sx, origin.sy);
            ctx.lineTo(pEnd.sx, pEnd.sy);
            ctx.strokeStyle = isDark ? `${ax.color}44` : `${ax.color}66`;
            ctx.lineWidth = 1;
            ctx.stroke();

            ctx.fillStyle = isDark ? `${ax.color}aa` : ax.color;
            ctx.font = '600 10px "JetBrains Mono", monospace';
            ctx.fillText(ax.label, pEnd.sx + 4, pEnd.sy + 3);
          });

          const ringSegments = 64;
          activeShells.forEach((sh) => {
            const shellR = 26 + sh.n * 22;
            ctx.save();
            ctx.beginPath();

            for (let s = 0; s <= ringSegments; s++) {
              const ang = (s / ringSegments) * Math.PI * 2;
              const c = Math.cos(ang) * shellR;
              const sn = Math.sin(ang) * shellR;

              let px = 0, py = 0, pz = 0;
              if (shellPlane === 'XY') { px = c; py = sn; pz = 0; }
              else if (shellPlane === 'YZ') { px = 0; py = c; pz = sn; }
              else { px = c; py = 0; pz = sn; }

              const pt = project3D(px, py, pz, width, height, cam, maxShellN);
              if (s === 0) ctx.moveTo(pt.sx, pt.sy);
              else ctx.lineTo(pt.sx, pt.sy);
            }

            ctx.setLineDash([3, 4]);
            ctx.strokeStyle = isDark
              ? 'rgba(168, 199, 250, 0.30)'
              : 'rgba(11, 87, 208, 0.28)';
            ctx.lineWidth = 1.15;
            ctx.stroke();
            ctx.setLineDash([]);

            let lx = 0, ly = 0, lz = 0;
            if (shellPlane === 'XY') lx = shellR;
            else if (shellPlane === 'YZ') ly = shellR;
            else lz = shellR;

            const labelPt = project3D(lx, ly, lz, width, height, cam, maxShellN);
            ctx.fillStyle = isDark
              ? 'rgba(227, 227, 227, 0.65)'
              : 'rgba(31, 31, 31, 0.65)';
            ctx.font = '500 9.5px "JetBrains Mono", monospace';
            ctx.fillText(`${sh.letter}(${sh.count})`, labelPt.sx + 4, labelPt.sy - 2);
            ctx.restore();
          });

          const projectedFaces = orbitalSurfaceFaces.map((f) => {
            const cProj = project3D(f.cx, f.cy, f.cz, width, height, cam, maxShellN);
            const pVerts = f.verts.map((v) =>
              project3D(v.x, v.y, v.z, width, height, cam, maxShellN)
            );
            return { ...f, pVerts, depth: cProj.depth };
          });

          projectedFaces.sort((a, b) => b.depth - a.depth);
          const singleOrbitalMode = targetSubshells.length === 1 && selectedOrbitalIdx !== 'all';

          for (let i = 0; i < projectedFaces.length; i++) {
            const face = projectedFaces[i];
            const pv = face.pVerts;
            const lightDot = Math.abs(face.nx * 0.45 - face.ny * 0.35 + face.nz * 0.82);
            const fillAlpha = 0.14 + 0.18 * lightDot;

            ctx.beginPath();
            ctx.moveTo(pv[0].sx, pv[0].sy);
            ctx.lineTo(pv[1].sx, pv[1].sy);
            ctx.lineTo(pv[2].sx, pv[2].sy);
            ctx.lineTo(pv[3].sx, pv[3].sy);
            ctx.closePath();

            const baseHex = singleOrbitalMode
              ? face.phaseSign > 0
                ? '#38bdf8'
                : '#f43f5e'
              : face.color;

            ctx.fillStyle = baseHex;
            ctx.globalAlpha = fillAlpha;
            ctx.fill();

            ctx.strokeStyle = baseHex;
            ctx.globalAlpha = fillAlpha * 0.55;
            ctx.lineWidth = 0.5;
            ctx.stroke();
          }
          ctx.globalAlpha = 1.0;

          // Nucleus
          ctx.beginPath();
          ctx.arc(origin.sx, origin.sy, Math.max(4, 5.5 * origin.scale), 0, Math.PI * 2);
          ctx.fillStyle = '#ef4444';
          ctx.fill();
          ctx.strokeStyle = isDark ? '#ffffff55' : '#00000033';
          ctx.lineWidth = 1;
          ctx.stroke();

          const targetSubSet = new Set(targetSubshells);
          const visibleElectrons = electrons3D.filter((e) => {
            if (!targetSubSet.has(e.subshell)) return false;
            if (
              selectedOrbitalIdx !== 'all' &&
              e.mIndex !== Number(selectedOrbitalIdx)
            ) {
              return false;
            }
            return true;
          });

          visibleElectrons.forEach((e) => {
            const pos = computeElectronPosition3D(e, t);
            if (!tracesRef.current[e.id]) {
              tracesRef.current[e.id] = [];
            }
            const history = tracesRef.current[e.id];
            if (simPlaying || history.length === 0) {
              history.push(pos);
              if (history.length > 48) {
                history.shift();
              }
            }

            if (history.length > 1) {
              for (let k = 1; k < history.length; k++) {
                const p0 = project3D(history[k - 1].x, history[k - 1].y, history[k - 1].z, width, height, cam, maxShellN);
                const p1 = project3D(history[k].x, history[k].y, history[k].z, width, height, cam, maxShellN);
                const age = k / history.length;
                ctx.beginPath();
                ctx.moveTo(p0.sx, p0.sy);
                ctx.lineTo(p1.sx, p1.sy);
                ctx.strokeStyle = e.color;
                ctx.globalAlpha = age * 0.7;
                ctx.lineWidth = Math.max(0.8, 2.0 * age * p1.scale);
                ctx.lineCap = 'round';
                ctx.stroke();
              }
              ctx.globalAlpha = 1.0;
            }

            const proj = project3D(pos.x, pos.y, pos.z, width, height, cam, maxShellN);
            const r = Math.max(2.6, 3.6 * proj.scale);
            ctx.beginPath();
            ctx.arc(proj.sx, proj.sy, r, 0, Math.PI * 2);
            ctx.fillStyle = e.color;
            ctx.fill();
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 0.9;
            ctx.stroke();
          });

          ctx.restore();
          animFrameId = requestAnimationFrame(renderFrame);
        };

        animFrameId = requestAnimationFrame(renderFrame);
        return () => cancelAnimationFrame(animFrameId);
      }, [
        isDark,
        simPlaying,
        shellPlane,
        activeShells,
        orbitalSurfaceFaces,
        targetSubshells,
        selectedOrbitalIdx,
        electrons3D,
        computeElectronPosition3D
      ]);

      const handlePointerDown = (e) => {
        const rect = canvasRef.current.getBoundingClientRect();
        cameraRef.current.isDragging = true;
        cameraRef.current.lastX = e.clientX - rect.left;
        cameraRef.current.lastY = e.clientY - rect.top;
      };

      const handlePointerMove = (e) => {
        if (!cameraRef.current.isDragging) return;
        const rect = canvasRef.current.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        const dx = x - cameraRef.current.lastX;
        const dy = y - cameraRef.current.lastY;

        cameraRef.current.rotY += dx * 0.0085;
        cameraRef.current.rotX = Math.max(
          -Math.PI / 2 + 0.05,
          Math.min(Math.PI / 2 - 0.05, cameraRef.current.rotX + dy * 0.0085)
        );
        cameraRef.current.lastX = x;
        cameraRef.current.lastY = y;
      };

      const handlePointerUp = () => {
        cameraRef.current.isDragging = false;
      };

      const handleWheel = (e) => {
        e.preventDefault();
        const delta = e.deltaY > 0 ? 0.9 : 1.1;
        cameraRef.current.zoom = Math.max(0.5, Math.min(2.4, cameraRef.current.zoom * delta));
      };

      const handleResetCamera = () => {
        cameraRef.current.rotX = 0.48;
        cameraRef.current.rotY = -0.62;
        cameraRef.current.zoom = 1.0;
      };

      const activeSubshellOrbitals = useMemo(() => {
        const activeSub = targetSubshells.length === 1 ? targetSubshells[0] : null;
        if (!activeSub) return [];
        const type = activeSub[1];
        return ORBITAL_LABELS[type] || [];
      }, [targetSubshells]);

      const currentOrbitalDescription = useMemo(() => {
        const activeSub = targetSubshells.length === 1 ? targetSubshells[0] : null;
        if (!activeSub) {
          return 'Translucent 3D spherical harmonic orbital surfaces with planar K–Q shell guides.';
        }
        const type = activeSub[1];
        if (selectedOrbitalIdx === 'all') {
          return ORBITAL_DESCRIPTIONS[type] || `3D ${activeSub} orbital geometry.`;
        }
        const label = ORBITAL_LABELS[type]?.[Number(selectedOrbitalIdx)];
        return ORBITAL_DESCRIPTIONS[label] || `3D ${activeSub} (${label}) orbital.`;
      }, [targetSubshells, selectedOrbitalIdx]);

      return (
        <div className="flex flex-col h-full justify-between space-y-3">
          <div className="flex flex-wrap items-center justify-between gap-2">
            <div className="flex items-center gap-2">
              <h3 className="text-sm font-semibold">3D Orbital Geometry</h3>
              <select
                value={selectedSubshell}
                onChange={(e) => setSelectedSubshell(e.target.value)}
                className={`px-2.5 py-1 rounded-xl border text-xs font-mono ${
                  isDark
                    ? 'bg-[#131314] border-[#2d2f31] text-[#e3e3e3]'
                    : 'bg-[#f8fafd] border-[#dde3ea] text-[#1f1f1f]'
                }`}
              >
                <option value="valence">
                  Valence ({occupiedSubshellsList[occupiedSubshellsList.length - 1]})
                </option>
                <option value="all">All Subshells</option>
                {occupiedSubshellsList.map((sub) => (
                  <option key={sub} value={sub}>
                    {sub} ({activeSubshellsMap[sub]} e⁻)
                  </option>
                ))}
              </select>
            </div>

            <div className="flex items-center gap-1">
              <span className="text-[11px] font-mono opacity-55 mr-1">Plane:</span>
              {['XY', 'YZ', 'ZX'].map((pl) => (
                <button
                  key={pl}
                  type="button"
                  onClick={() => setShellPlane(pl)}
                  className={`px-2.5 py-1 rounded-full text-[11px] font-mono font-medium transition-colors ${
                    shellPlane === pl
                      ? isDark
                        ? 'bg-[#a8c7fa] text-[#041e49]'
                        : 'bg-[#0b57d0] text-white'
                      : isDark
                      ? 'bg-[#131314] text-[#c4c7c5] hover:bg-[#282a2c]'
                      : 'bg-[#f0f4f9] text-[#444746] hover:bg-[#e1e6ec]'
                  }`}
                >
                  {pl}
                </button>
              ))}
            </div>
          </div>

          {targetSubshells.length === 1 && activeSubshellOrbitals.length > 1 && (
            <div className="flex flex-wrap gap-1.5">
              <button
                type="button"
                onClick={() => setSelectedOrbitalIdx('all')}
                className={`px-2.5 py-1 rounded-full text-[11px] font-mono border transition-colors ${
                  selectedOrbitalIdx === 'all'
                    ? isDark
                      ? 'bg-[#a8c7fa] text-[#041e49] border-transparent'
                      : 'bg-[#0b57d0] text-white border-transparent'
                    : isDark
                    ? 'bg-[#131314] border-[#2d2f31] text-[#c4c7c5]'
                    : 'bg-[#f8fafd] border-[#dde3ea] text-[#444746]'
                }`}
              >
                All {targetSubshells[0]}
              </button>
              {activeSubshellOrbitals.map((orbLabel, idx) => (
                <button
                  key={orbLabel}
                  type="button"
                  onClick={() => setSelectedOrbitalIdx(idx)}
                  className={`px-2.5 py-1 rounded-full text-[11px] font-mono border transition-colors ${
                    Number(selectedOrbitalIdx) === idx
                      ? isDark
                        ? 'bg-[#a8c7fa] text-[#041e49] border-transparent'
                        : 'bg-[#0b57d0] text-white border-transparent'
                      : isDark
                      ? 'bg-[#131314] border-[#2d2f31] text-[#c4c7c5]'
                      : 'bg-[#f8fafd] border-[#dde3ea] text-[#444746]'
                  }`}
                >
                  {targetSubshells[0][0]}{orbLabel}
                </button>
              ))}
            </div>
          )}

          <div
            className={`relative rounded-2xl border overflow-hidden select-none flex-1 min-h-[380px] ${
              isDark ? 'bg-[#101214] border-[#2d2f31]' : 'bg-[#f4f7fb] border-[#dde3ea]'
            }`}
          >
            <canvas
              ref={canvasRef}
              onPointerDown={handlePointerDown}
              onPointerMove={handlePointerMove}
              onPointerUp={handlePointerUp}
              onPointerLeave={handlePointerUp}
              onWheel={handleWheel}
              className="w-full h-full block cursor-grab active:cursor-grabbing touch-none"
            />

            <div className="absolute top-3 right-3 flex items-center gap-1.5">
              <button
                type="button"
                onClick={() => setSimPlaying(!simPlaying)}
                className={`px-2.5 py-1 rounded-lg border text-[11px] font-mono flex items-center gap-1 backdrop-blur-md ${
                  isDark
                    ? 'bg-[#131314]/80 border-[#2d2f31] text-[#e3e3e3]'
                    : 'bg-white/85 border-[#dde3ea] text-[#1f1f1f]'
                }`}
              >
                {simPlaying ? <Pause className="w-3 h-3" /> : <Play className="w-3 h-3" />}
                <span>{simPlaying ? 'Pause' : 'Play'}</span>
              </button>
              <button
                type="button"
                onClick={handleResetCamera}
                className={`px-2.5 py-1 rounded-lg border text-[11px] font-mono backdrop-blur-md ${
                  isDark
                    ? 'bg-[#131314]/80 border-[#2d2f31] text-[#e3e3e3]'
                    : 'bg-white/85 border-[#dde3ea] text-[#1f1f1f]'
                }`}
              >
                Reset
              </button>
            </div>
          </div>

          <p className="text-[11px] opacity-60 leading-relaxed">
            {currentOrbitalDescription}
          </p>
        </div>
      );
    }
